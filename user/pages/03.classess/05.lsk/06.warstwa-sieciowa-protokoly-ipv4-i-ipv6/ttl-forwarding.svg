<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 980 300" aria-label="Dekrementacja TTL przy każdym przeskoku routingu i odrzucenie pakietu po osiągnięciu zera"><metadata/><style>.t{font-family:Arial,sans-serif;font-size:13px;fill:#0f172a;text-anchor:middle}.h{font-family:Arial,sans-serif;font-size:15px;font-weight:bold;fill:#0f172a}.f{font-family:Arial,sans-serif;font-size:11.5px;fill:#334155;text-anchor:middle}.ttl{font-family:Consolas,monospace;font-size:14px;font-weight:bold;text-anchor:middle}</style><rect width="980" height="300" fill="#ffffff"/><text class="h" x="20" y="26">Pole TTL (Time To Live) — dekrementacja o 1 na każdym routerze</text><rect x="35" y="90" width="110" height="50" rx="8" fill="#93c5fd" stroke="#1e293b" stroke-width="1.6"/><text class="t" x="90" y="120">Host A</text><text class="ttl" x="90" y="70" fill="#0f172a">TTL=64</text><rect x="215" y="90" width="110" height="50" rx="8" fill="#86efac" stroke="#1e293b" stroke-width="1.6"/><text class="t" x="270" y="120">R1</text><text class="ttl" x="270" y="70" fill="#0f172a">TTL=63</text><line x1="145" y1="115" x2="215" y2="115" stroke="#1e293b" stroke-width="2"/><path d="M205 110 L215 115 L205 120" fill="none" stroke="#1e293b" stroke-width="2"/><text class="f" x="180" y="105">TTL−1</text><rect x="395" y="90" width="110" height="50" rx="8" fill="#86efac" stroke="#1e293b" stroke-width="1.6"/><text class="t" x="450" y="120">R2</text><text class="ttl" x="450" y="70" fill="#0f172a">TTL=62</text><line x1="325" y1="115" x2="395" y2="115" stroke="#1e293b" stroke-width="2"/><path d="M385 110 L395 115 L385 120" fill="none" stroke="#1e293b" stroke-width="2"/><text class="f" x="360" y="105">TTL−1</text><rect x="575" y="90" width="110" height="50" rx="8" fill="#86efac" stroke="#1e293b" stroke-width="1.6"/><text class="t" x="630" y="120">R3</text><text class="ttl" x="630" y="70" fill="#0f172a">TTL=61</text><line x1="505" y1="115" x2="575" y2="115" stroke="#1e293b" stroke-width="2"/><path d="M565 110 L575 115 L565 120" fill="none" stroke="#1e293b" stroke-width="2"/><text class="f" x="540" y="105">TTL−1</text><rect x="775" y="90" width="110" height="50" rx="8" fill="#fca5a5" stroke="#1e293b" stroke-width="1.6"/><text class="t" x="830" y="120">R4 (padnie tu)</text><text class="ttl" x="830" y="70" fill="#dc2626">TTL=0</text><line x1="685" y1="115" x2="775" y2="115" stroke="#1e293b" stroke-width="2"/><path d="M765 110 L775 115 L765 120" fill="none" stroke="#1e293b" stroke-width="2"/><text class="f" x="730" y="105">TTL−1</text><line x1="830" y1="140" x2="830" y2="200" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/><path d="M825 195 L830 205 L835 195" fill="none" stroke="#dc2626" stroke-width="2"/><text class="f" x="830" y="222" fill="#dc2626">pakiet odrzucony (TTL osiągnęło 0)</text><path d="M830 200 C 650 260, 300 260, 90 145" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#f59e0b"/></marker></defs><text class="f" x="470" y="268" fill="#b45309">R4 odsyła do Host A komunikat ICMP Time Exceeded (Typ 11) — mechanizm wykorzystywany przez traceroute</text></svg>