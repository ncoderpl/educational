<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 780 220" aria-label="Porównanie rozmiaru ramki standardowej i ramki Jumbo"><metadata/><style> .barA { fill:#93c5fd; stroke:#1e293b; stroke-width:1.5; } .barB { fill:#86efac; stroke:#1e293b; stroke-width:1.5; } .lbl { font-family: Arial, sans-serif; font-size:13px; fill:#0f172a; } .sub { font-family: Arial, sans-serif; font-size:12px; fill:#334155; } .ref { stroke:#dc2626; stroke-width:1.5; stroke-dasharray:5,4; } </style><text class="lbl" x="10" y="40">Ramka standardowa</text><rect class="barA" x="150" y="20" width="101" height="30"/><text class="sub" x="260" y="40">1518 B (MTU 1500 B)</text><text class="lbl" x="10" y="110">Ramka Jumbo</text><rect class="barB" x="150" y="90" width="600" height="30"/><text class="sub" x="150" y="140">~9000 B (MTU ~8992 B, wartość nieznormalizowana)</text><line class="ref" x1="251" y1="15" x2="251" y2="125"/><text class="sub" x="256" y="170" fill="#dc2626">granica ramki standardowej (1518 B)</text><line x1="150" y1="190" x2="750" y2="190" stroke="#0f172a" stroke-width="1"/><text class="sub" x="150" y="205">0 B</text><text class="sub" x="700" y="205">9000 B</text></svg>