<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 940 320" aria-label="Topologie sieci WAN: punkt-punkt, gwiazda i pełna siatka"><metadata/><style> .h{font-family:Arial,sans-serif;font-size:14px;font-weight:bold;fill:#0f172a;text-anchor:middle} .t{font-family:Arial,sans-serif;font-size:12px;fill:#0f172a;text-anchor:middle} .c{font-family:Arial,sans-serif;font-size:12px;fill:#334155;text-anchor:middle} .n{fill:#bfdbfe;stroke:#1e3a8a;stroke-width:1.5} .hub{fill:#fca5a5;stroke:#7f1d1d;stroke-width:1.5} .l{stroke:#0f172a;stroke-width:1.8} </style><rect width="940" height="320" fill="#ffffff"/><text class="h" x="150" y="30">Punkt–punkt</text><line class="l" x1="70" y1="140" x2="230" y2="140"/><circle class="n" cx="70" cy="140" r="20"/><text class="t" x="70" y="145">A</text><circle class="n" cx="230" cy="140" r="20"/><text class="t" x="230" y="145">B</text><text class="c" x="150" y="128">łącze dzierżawione</text><text class="c" x="150" y="260">n = 2 węzły → 1 łącze</text><text class="c" x="150" y="280">najprostsza, drogie przy wielu lokalizacjach</text><text class="h" x="470" y="30">Gwiazda (hub-and-spoke)</text><line class="l" x1="470" y1="140" x2="390" y2="80"/><line class="l" x1="470" y1="140" x2="550" y2="80"/><line class="l" x1="470" y1="140" x2="390" y2="220"/><line class="l" x1="470" y1="140" x2="550" y2="220"/><circle class="hub" cx="470" cy="140" r="22"/><text class="t" x="470" y="145">HQ</text><circle class="n" cx="390" cy="80" r="18"/><text class="t" x="390" y="85">O1</text><circle class="n" cx="550" cy="80" r="18"/><text class="t" x="550" y="85">O2</text><circle class="n" cx="390" cy="220" r="18"/><text class="t" x="390" y="225">O3</text><circle class="n" cx="550" cy="220" r="18"/><text class="t" x="550" y="225">O4</text><text class="c" x="470" y="260">n węzłów → n − 1 łączy</text><text class="c" x="470" y="280">tanio, ale węzeł centralny to punkt awarii</text><text class="h" x="790" y="30">Pełna siatka (full mesh)</text><line class="l" x1="720" y1="80" x2="860" y2="80"/><line class="l" x1="720" y1="220" x2="860" y2="220"/><line class="l" x1="720" y1="80" x2="720" y2="220"/><line class="l" x1="860" y1="80" x2="860" y2="220"/><line class="l" x1="720" y1="80" x2="860" y2="220"/><line class="l" x1="860" y1="80" x2="720" y2="220"/><circle class="n" cx="720" cy="80" r="18"/><text class="t" x="720" y="85">A</text><circle class="n" cx="860" cy="80" r="18"/><text class="t" x="860" y="85">B</text><circle class="n" cx="720" cy="220" r="18"/><text class="t" x="720" y="225">C</text><circle class="n" cx="860" cy="220" r="18"/><text class="t" x="860" y="225">D</text><text class="c" x="790" y="260">n(n − 1)/2 łączy (dla n = 4: 6)</text><text class="c" x="790" y="280">największa niezawodność, największy koszt</text></svg>