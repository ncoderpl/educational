<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 980 440" aria-label="Fragmentacja datagramu IPv4 o rozmiarze 4028 bajtów na trzy fragmenty przy MTU 1500"><metadata/><style>.t{font-family:Arial,sans-serif;font-size:12px;fill:#0f172a;text-anchor:middle}.h{font-family:Arial,sans-serif;font-size:15px;font-weight:bold;fill:#0f172a}.f{font-family:Arial,sans-serif;font-size:11.5px;fill:#334155}.m{font-family:Consolas,monospace;font-size:11px;fill:#0f172a;text-anchor:middle}</style><rect width="980" height="440" fill="#ffffff"/><text class="h" x="20" y="26">Oryginalny datagram: nagłówek 20 B + dane 4000 B = 4020 B (ID = 51 200)</text><rect x="40" y="45" width="60" height="40" fill="#fde68a" stroke="#1e293b" stroke-width="1.5"/><text class="t" x="70" y="69">nagł. 20 B</text><rect x="100" y="45" width="800" height="40" fill="#86efac" stroke="#1e293b" stroke-width="1.5"/><text class="t" x="500" y="69">dane: 4000 bajtów (bajty 0–3999)</text><text class="f" x="20" y="110">MTU łącza wychodzącego = 1500 B → maksymalne dane na fragment = 1500 − 20 (nagłówek) = 1480 B, zaokrąglone w dół do wielokrotności 8 B (bez zmian: 1480 = 185·8)</text><rect x="40" y="150" width="60" height="40" fill="#fde68a" stroke="#1e293b" stroke-width="1.5"/><text class="t" x="70" y="174">nagł. 20 B</text><rect x="100" y="150" width="800" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="108.0" y="150" width="296.0" height="40" fill="#93c5fd" stroke="#1e293b" stroke-width="1.5"/><text class="t" x="256.0" y="174">bajty 40–1519 (1480 B)</text><text class="f" x="915" y="168">Fragment 1</text><text class="f" x="915" y="184">MF=1</text><text class="f" x="40" y="208">ID = 51 200 (bez zmian), Fragment Offset = 0/8 = 0, długość całkowita = 20 + 1480 = 1500 B</text><rect x="40" y="245" width="60" height="40" fill="#fde68a" stroke="#1e293b" stroke-width="1.5"/><text class="t" x="70" y="269">nagł. 20 B</text><rect x="100" y="245" width="800" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="396.0" y="245" width="296.0" height="40" fill="#93c5fd" stroke="#1e293b" stroke-width="1.5"/><text class="t" x="544.0" y="269">bajty 1480–2959 (1480 B)</text><text class="f" x="915" y="263">Fragment 2</text><text class="f" x="915" y="279">MF=1</text><text class="f" x="40" y="303">ID = 51 200 (bez zmian), Fragment Offset = 1480/8 = 185, długość całkowita = 20 + 1480 = 1500 B</text><rect x="40" y="340" width="60" height="40" fill="#fde68a" stroke="#1e293b" stroke-width="1.5"/><text class="t" x="70" y="364">nagł. 20 B</text><rect x="100" y="340" width="800" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="692.0" y="340" width="208.0" height="40" fill="#93c5fd" stroke="#1e293b" stroke-width="1.5"/><text class="t" x="796.0" y="364">bajty 2960–3999 (1040 B)</text><text class="f" x="915" y="358">Fragment 3</text><text class="f" x="915" y="374">MF=0</text><text class="f" x="40" y="398">ID = 51 200 (bez zmian), Fragment Offset = 2960/8 = 370, długość całkowita = 20 + 1040 = 1060 B</text><text class="f" x="20" y="435" font-weight="bold">Pole Identification jest identyczne we wszystkich fragmentach — to ono pozwala odbiorcy zgrupować fragmenty przed ponownym złożeniem (reasembly).</text></svg>