<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 980 480" aria-label="Domeny kolizyjne i rozgłoszeniowe w sieci z hubem, przełącznikami i routerem" version="1.1" id="svg28"><defs id="defs28"/><metadata id="metadata1"></metadata><style id="style1"> .t{font-family:Arial,sans-serif;font-size:12px;fill:#0f172a;text-anchor:middle} .h{font-family:Arial,sans-serif;font-size:15px;font-weight:bold;fill:#0f172a} .f{font-family:Arial,sans-serif;font-size:11px;fill:#334155;text-anchor:middle} .dev{fill:#fde68a;stroke:#1e293b;stroke-width:1.6} </style><rect width="980" height="480" fill="#ffffff" id="rect1"/><text class="h" x="20" y="26" id="text1">Router dzieli sieć na dwie domeny rozgłoszeniowe; w ich obrębie przełączniki i hub tworzą różne domeny kolizyjne</text><rect x="20" y="55" width="440" height="400" rx="16" fill="#dbeafe" fill-opacity="0.5" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="9,5" id="rect2"/><text class="f" x="240" y="75" fill="#1d4ed8" font-weight="bold" id="text2">DOMENA ROZGŁOSZENIOWA A (VLAN 10 / sieć 192.168.10.0/24)</text><rect x="520" y="55" width="440" height="400" rx="16" fill="#dcfce7" fill-opacity="0.5" stroke="#15803d" stroke-width="2.2" stroke-dasharray="9,5" id="rect3"/><text class="f" x="740" y="75" fill="#15803d" font-weight="bold" id="text3">DOMENA ROZGŁOSZENIOWA B (VLAN 20 / sieć 192.168.20.0/24)</text><rect class="dev" x="444.81335" y="84.312378" width="100" height="42" rx="8" id="rect4"/><text class="t" x="496.73871" y="107.38703" id="text4">ROUTER (L3)</text><line x1="446.54333" y1="95.389557" x2="251.53131" y2="128.81084" stroke="#1e293b" stroke-width="1.76591" id="line4"/><line x1="545.02948" y1="100.32024" x2="765.02948" y2="138.32024" stroke="#1e293b" stroke-width="2" id="line5"/><rect class="dev" x="180" y="95" width="120" height="44" id="rect5"/><text class="t" x="240" y="121" id="text5">SWITCH A</text><g id="g6"><ellipse cx="90" cy="200" rx="60" ry="26" fill="#fca5a5" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.6" id="ellipse5"/><line x1="200" y1="139" x2="90" y2="175" stroke="#1e293b" stroke-width="2" id="line6"/><circle cx="90" cy="200" r="18" fill="#93c5fd" stroke="#1e293b" id="circle6"/><text class="t" x="90" y="204" style="font-size:10px" id="text6">PC1</text></g><g id="g7"><ellipse cx="240" cy="200" rx="60" ry="26" fill="#fdba74" fill-opacity="0.45" stroke="#c2410c" stroke-width="1.6" id="ellipse6"/><line x1="240" y1="139" x2="240" y2="175" stroke="#1e293b" stroke-width="2" id="line7"/><circle cx="240" cy="200" r="18" fill="#93c5fd" stroke="#1e293b" id="circle7"/><text class="t" x="240" y="204" style="font-size:10px" id="text7">PC2</text></g><line x1="280" y1="139" x2="390" y2="175" stroke="#1e293b" stroke-width="2" id="line8"/><rect class="dev" x="350" y="175" width="80" height="36" fill="#fef08a" id="rect8"/><text class="t" x="390" y="197" style="font-size:11px" id="text8">HUB</text><ellipse cx="390" cy="290" rx="115" ry="70" fill="#fecaca" fill-opacity="0.55" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" id="ellipse8"/><text class="f" x="390" y="228" fill="#7f1d1d" id="text9">jedna wspólna domena kolizyjna (hub)</text><line x1="360" y1="211" x2="330" y2="255" stroke="#1e293b" stroke-width="1.8" id="line9"/><line x1="390" y1="211" x2="390" y2="255" stroke="#1e293b" stroke-width="1.8" id="line10"/><line x1="420" y1="211" x2="450" y2="255" stroke="#1e293b" stroke-width="1.8" id="line11"/><circle cx="330" cy="270" r="16" fill="#a7f3d0" stroke="#1e293b" id="circle11"/><text class="t" x="330" y="274" style="font-size:9px" id="text11">PC3</text><circle cx="390" cy="285" r="16" fill="#a7f3d0" stroke="#1e293b" id="circle12"/><text class="t" x="390" y="289" style="font-size:9px" id="text12">PC4</text><circle cx="450" cy="270" r="16" fill="#a7f3d0" stroke="#1e293b" id="circle13"/><text class="t" x="450" y="274" style="font-size:9px" id="text13">PC5</text><text class="f" x="390" y="380" id="text14">Domena rozgłoszeniowa A obejmuje: PC1, PC2, PC3, PC4, PC5</text><text class="f" x="390" y="396" id="text15">— to jeden ciągły obszar zalewany ramkami broadcast (np. ARP).</text><text class="f" x="390" y="418" id="text16">Domeny kolizyjne w jej obrębie: {PC1}, {PC2}, {PC3,PC4,PC5}</text><text class="f" x="390" y="434" id="text17">— 3 osobne domeny kolizyjne w 1 domenie rozgłoszeniowej.</text><rect class="dev" x="680" y="95" width="120" height="44" id="rect17"/><text class="t" x="740" y="121" id="text18">SWITCH B</text><g id="g19"><ellipse cx="650" cy="220" rx="60" ry="26" fill="#c4b5fd" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.6" id="ellipse18"/><line x1="700" y1="139" x2="650" y2="195" stroke="#1e293b" stroke-width="2" id="line18"/><circle cx="650" cy="220" r="18" fill="#93c5fd" stroke="#1e293b" id="circle18"/><text class="t" x="650" y="224" style="font-size:10px" id="text19">PC6</text></g><g id="g20"><ellipse cx="740" cy="220" rx="60" ry="26" fill="#c4b5fd" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.6" id="ellipse19"/><line x1="740" y1="139" x2="740" y2="195" stroke="#1e293b" stroke-width="2" id="line19"/><circle cx="740" cy="220" r="18" fill="#93c5fd" stroke="#1e293b" id="circle19"/><text class="t" x="740" y="224" style="font-size:10px" id="text20">PC7</text></g><g id="g21"><ellipse cx="830" cy="220" rx="60" ry="26" fill="#c4b5fd" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.6" id="ellipse20"/><line x1="780" y1="139" x2="830" y2="195" stroke="#1e293b" stroke-width="2" id="line20"/><circle cx="830" cy="220" r="18" fill="#93c5fd" stroke="#1e293b" id="circle20"/><text class="t" x="830" y="224" style="font-size:10px" id="text21">PC8</text></g><text class="f" x="740" y="290" id="text22">Domena rozgłoszeniowa B: PC6, PC7, PC8.</text><text class="f" x="740" y="308" id="text23">Switch B (pełny duplex na każdym porcie) →</text><text class="f" x="740" y="324" id="text24">3 osobne domeny kolizyjne, po jednej na host.</text><text class="f" x="740" y="346" id="text25">Ramka rozgłoszeniowa z domeny A</text><text class="f" x="740" y="362" id="text26">NIE dotrze do PC6–PC8 — router</text><text class="f" x="740" y="378" id="text27">blokuje ruch broadcast między sieciami.</text><text class="f" x="490" y="470" font-weight="bold" id="text28">Zasada: hub/switch nie dzielą domeny rozgłoszeniowej — tylko router (lub podział na VLAN-y) ją segmentuje.</text></svg>