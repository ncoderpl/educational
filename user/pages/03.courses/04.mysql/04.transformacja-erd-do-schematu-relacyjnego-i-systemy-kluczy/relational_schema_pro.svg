<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="auto" style="background-color: #0f172a; border-radius: 8px;"><style> .title-main { fill: #38bdf8; font-family: sans-serif; font-weight: bold; font-size: 20px; text-anchor: middle; } .subtitle-main { fill: #94a3b8; font-family: sans-serif; font-size: 13px; text-anchor: middle; } .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; } .table-title { fill: #f8fafc; font-family: sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; } .line { stroke: #475569; stroke-width: 1.5; } .text-pk { fill: #fbbf24; font-family: sans-serif; font-weight: bold; font-size: 13px; } .text-fk { fill: #c084fc; font-family: sans-serif; font-weight: bold; font-size: 13px; } .text-uq { fill: #38bdf8; font-family: sans-serif; font-weight: bold; font-size: 13px; } .text-col { fill: #f1f5f9; font-family: sans-serif; font-size: 13.5px; } .text-dtype { fill: #94a3b8; font-family: sans-serif; font-size: 12.5px; text-anchor: end; } .rel-text { fill: #c084fc; font-family: sans-serif; font-weight: bold; font-size: 13px; text-anchor: middle; } .rel-line { stroke: #c084fc; stroke-width: 2.5; marker-end: url(#arrow-purple); } </style><defs><marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/></marker></defs><text x="550" y="40" class="title-main">ARCHITEKTURA RELACYJNEGO SCHEMATU BAZY DANYCH (RDBMS)</text><text x="550" y="65" class="subtitle-main">Fizyczna reprezentacja tabel, kluczy głównych (PK), kluczy obcych (FK) oraz więzów unikalności (UQ)</text><g transform="translate(60, 100)"><rect width="300" height="350" class="box"/><text x="150" y="35" class="table-title">tabela: klienci</text><line x1="0" y1="55" x2="300" y2="55" class="line"/><text x="25" y="90" class="text-pk">PK</text><text x="90" y="90" class="text-col">klient_id</text><text x="275" y="90" class="text-dtype">BIGINT</text><text x="25" y="140" class="text-uq">UQ</text><text x="90" y="140" class="text-col">adres_email</text><text x="275" y="140" class="text-dtype">VARCHAR(150)</text><text x="90" y="190" class="text-col">nazwa_firmy</text><text x="275" y="190" class="text-dtype">VARCHAR(100)</text><text x="90" y="240" class="text-col">status_konta</text><text x="275" y="240" class="text-dtype">ENUM</text><text x="90" y="290" class="text-col">utworzono</text><text x="275" y="290" class="text-dtype">TIMESTAMP</text></g><g transform="translate(400, 100)"><rect width="300" height="380" class="box"/><text x="150" y="35" class="table-title">tabela: zamowienia</text><line x1="0" y1="55" x2="300" y2="55" class="line"/><text x="25" y="90" class="text-pk">PK</text><text x="90" y="90" class="text-col">zamowienie_id</text><text x="275" y="90" class="text-dtype">BIGINT</text><text x="25" y="140" class="text-fk">FK</text><text x="90" y="140" class="text-col">klient_id</text><text x="275" y="140" class="text-dtype">BIGINT</text><text x="25" y="190" class="text-uq">UQ</text><text x="90" y="190" class="text-col">numer_faktury</text><text x="275" y="190" class="text-dtype">VARCHAR(50)</text><text x="90" y="240" class="text-col">data_zlozenia</text><text x="275" y="240" class="text-dtype">DATETIME</text><text x="90" y="290" class="text-col">kwota_brutto</text><text x="275" y="290" class="text-dtype">DECIMAL(10,2)</text><text x="90" y="340" class="text-col">status_zamowienia</text><text x="275" y="340" class="text-dtype">VARCHAR(30)</text></g><g transform="translate(740, 100)"><rect width="300" height="350" class="box"/><text x="150" y="35" class="table-title">tabela: produkty</text><line x1="0" y1="55" x2="300" y2="55" class="line"/><text x="25" y="90" class="text-pk">PK</text><text x="90" y="90" class="text-col">produkt_id</text><text x="275" y="90" class="text-dtype">INT</text><text x="25" y="140" class="text-uq">UQ</text><text x="90" y="140" class="text-col">kod_produktu</text><text x="275" y="140" class="text-dtype">VARCHAR(64)</text><text x="90" y="190" class="text-col">nazwa_towaru</text><text x="275" y="190" class="text-dtype">VARCHAR(150)</text><text x="90" y="240" class="text-col">cena_katalogowa</text><text x="275" y="240" class="text-dtype">DECIMAL(8,2)</text><text x="90" y="290" class="text-col">stan_magazynowy</text><text x="275" y="290" class="text-dtype">INT</text></g><path d="M 400 240 L 360 240" class="rel-line"/><rect x="345" y="220" width="70" height="30" fill="#0f172a" rx="4"/><text x="380" y="240" class="rel-text">FK (1 : N)</text></svg>