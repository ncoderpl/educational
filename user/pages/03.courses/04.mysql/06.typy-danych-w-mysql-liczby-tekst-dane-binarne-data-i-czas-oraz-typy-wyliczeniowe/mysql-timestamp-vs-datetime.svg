<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 960 430" aria-label="TIMESTAMP i DATETIME a strefy czasowe sesji"><rect width="960" height="430" fill="#ffffff"/><text x="20" y="34" style="font-family:Arial,sans-serif;font-size:18px;font-weight:bold;fill:#0B1220">Ta sama wartość, dwa typy, dwie strefy czasowe sesji</text><text x="20" y="72" style="font-family:Arial,sans-serif;font-size:15px;font-weight:bold;fill:#C0392B">TIMESTAMP — przeliczany przez strefę sesji</text><rect x="20" y="90" width="270" height="100" rx="10" fill="#FDECEA" stroke="#E2574C" stroke-width="1.6"/><text x="155.0" y="116" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:bold;fill:#0B1220">Sesja A (UTC+01:00)</text><text x="155.0" y="138" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:normal;fill:#0B1220">INSERT '2026-11-10 13:00:00'</text><line x1="290" y1="140" x2="342" y2="140" stroke="#0B1220" stroke-width="2"/><path d="M338 134 L350 140 L338 146 Z" fill="#0B1220"/><text x="320.0" y="132" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#475569">do UTC</text><rect x="350" y="90" width="260" height="100" rx="10" fill="#FFF4D6" stroke="#F2A541" stroke-width="1.6"/><text x="480.0" y="116" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:bold;fill:#0B1220">Przechowywane wewnętrznie</text><text x="480.0" y="138" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:normal;fill:#0B1220">12:00:00 UTC</text><text x="480.0" y="160" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:normal;fill:#0B1220">(sekundy od 1970-01-01)</text><line x1="610" y1="140" x2="662" y2="140" stroke="#0B1220" stroke-width="2"/><path d="M658 134 L670 140 L658 146 Z" fill="#0B1220"/><text x="640.0" y="132" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#4