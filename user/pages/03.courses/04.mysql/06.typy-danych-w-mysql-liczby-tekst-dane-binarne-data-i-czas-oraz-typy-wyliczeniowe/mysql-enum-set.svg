<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 960 470" aria-label="ENUM jako indeks oraz SET jako maska bitowa"><rect width="960" height="470" fill="#ffffff"/><text x="20" y="34" style="font-family:Arial,sans-serif;font-size:18px;font-weight:bold;fill:#0B1220">ENUM to numer na liście, SET to maska bitowa</text><text x="20" y="72" style="font-family:Arial,sans-serif;font-size:14px;font-weight:bold;fill:#8E6BBF">ENUM('nowe','w_toku','zrealizowane')</text><rect x="20" y="90" width="64" height="38" rx="6" fill="#8E6BBF"/><text x="52" y="114" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:14px;font-weight:bold;fill:#ffffff">0</text><rect x="84" y="90" width="260" height="38" rx="6" fill="#E5E7EB" stroke="#8E6BBF"/><text x="100" y="114" style="font-family:Arial,sans-serif;font-size:13px;fill:#0B1220">'' (wartość błędna)</text><rect x="20" y="140" width="64" height="38" rx="6" fill="#8E6BBF"/><text x="52" y="164" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:14px;font-weight:bold;fill:#ffffff">1</text><rect x="84" y="140" width="260" height="38" rx="6" fill="#E6DDF5" stroke="#8E6BBF"/><text x="100" y="164" style="font-family:Arial,sans-serif;font-size:13px;fill:#0B1220">'nowe'</text><rect x="20" y="190" width="64" height="38" rx="6" fill="#8E6BBF"/><text x="52" y="214" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:14px;font-weight:bold;fill:#ffffff">2</text><rect x="84" y="190" width="260" height="38" rx="6" fill="#E6DDF5" stroke="#8E6BBF"/><text x="100" y="214" style="font-family:Arial,sans-serif;font-size:13px;fill:#0B1220">'w_toku'</text><rect x="20" y="240" width="64" height="38" rx="6" fill="#8E6BBF"/><text x="52" y="264" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:14px;font-weight:bold;fill:#ffffff">3</text><rect x="84" y="240" width="260" height="38" rx="6" fill="#E6DDF5" stroke="#8E6BBF"/><text x="100" y="264" style="font-family:Arial,sans-serif;font-size:13px;fill:#0B1220">'zrealizowane'</text><rect x="20" y="290" width="64" height="38" rx="6" fill="#8E6BBF"/><text x="52" y="314" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:14px;font-weight:bold;fill:#ffffff">NULL</text><rect x="84" y="290" width="260" height="38" rx="6" fill="#F3F4F6" stroke="#8E6BBF"/><text x="100" y="314" style="font-family:Arial,sans-serif;font-size:13px;fill:#0B1220">NULL</text><text x="20" y="352" style="font-family:Arial,sans-serif;font-size:12px;fill:#475569">Sortowanie ORDER BY idzie po numerze,</text><text x="20" y="369" style="font-family:Arial,sans-serif;font-size:12px;fill:#475569">nie alfabetycznie. Zapis: 1 bajt (do 255</text><text x="20" y="386" style="font-family:Arial,sans-serif;font-size:12px;fill:#475569">elementów) lub 2 bajty (do 65 535).</text><text x="400" y="72" style="font-family:Arial,sans-serif;font-size:14px;font-weight:bold;fill:#0E7C86">SET('czytanie','sport','muzyka','podroze')</text><rect x="400" y="90" width="125" height="46" rx="8" fill="#E5E7EB" stroke="#0E7C86"/><text x="462.5" y="110" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:bold;fill:#0B1220">czytanie</text><text x="462.5" y="128" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11.5px;fill:#0B1220">waga 1</text><rect x="400" y="146" width="125" height="40" rx="8" fill="#ffffff" stroke="#0E7C86"/><text x="462.5" y="173" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:18px;font-weight:bold;fill:#0B1220">0</text><rect x="535" y="90" width="125" height="46" rx="8" fill="#0E7C86" stroke="#0E7C86"/><text x="597.5" y="110" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:bold;fill:#ffffff">sport</text><text x="597.5" y="128" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11.5px;fill:#ffffff">waga 2</text><rect x="535" y="146" width="125" height="40" rx="8" fill="#ffffff" stroke="#0E7C86"/><text x="597.5" y="173" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:18px;font-weight:bold;fill:#0B1220">1</text><rect x="670" y="90" width="125" height="46" rx="8" fill="#E5E7EB" stroke="#0E7C86"/><text x="732.5" y="110" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:bold;fill:#0B1220">muzyka</text><text x="732.5" y="128" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11.5px;fill:#0B1220">waga 4</text><rect x="670" y="146" width="125" height="40" rx="8" fill="#ffffff" stroke="#0E7C86"/><text x="732.5" y="173" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:18px;font-weight:bold;fill:#0B1220">0</text><rect x="805" y="90" width="125" height="46" rx="8" fill="#0E7C86" stroke="#0E7C86"/><text x="867.5" y="110" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:13px;font-weight:bold;fill:#ffffff">podroze</text><text x="867.5" y="128" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11.5px;fill:#ffffff">waga 8</text><rect x="805" y="146" width="125" height="40" rx="8" fill="#ffffff" stroke="#0E7C86"/><text x="867.5" y="173" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:18px;font-weight:bold;fill:#0B1220">1</text><text x="400" y="222" style="font-family:Arial,sans-serif;font-size:13px;fill:#0B1220">Wartość <tspan font-weight="bold">'sport,podroze'</tspan> to bity 0101 (od pierwszego do czwartego elementu):</text><text x="400" y="250" style="font-family:Arial,sans-serif;font-size:15px;font-weight:bold;fill:#0E7C86">2 + 8 = 10 (binarnie 1010)</text><text x="400" y="288" style="font-family:Arial,sans-serif;font-size:12px;fill:#475569">Zapis: 1 bajt (do 8 elementów), 2 (do 16), 3 (do 24),</text><text x="400" y="305" style="font-family:Arial,sans-serif;font-size:12px;fill:#475569">4 (do 32) lub 8 bajtów (do 64 elementów).</text><text x="400" y="340" style="font-family:Arial,sans-serif;font-size:12px;fill:#0B1220">Sprawdzenie członkostwa: FIND_IN_SET('sport', hobby) &gt; 0 lub hobby &amp; 2</text><text x="400" y="360" style="font-family:Arial,sans-serif;font-size:12px;fill:#0B1220">Dodanie elementu: hobby = hobby | 4</text><metadata/></svg>