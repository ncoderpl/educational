<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif"><metadata/><rect width="1000" height="620" fill="#ffffff"/><text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Silniki składowania danych w MySQL</text><text x="500" y="56" text-anchor="middle" font-size="12" fill="#555">każda tabela może mieć własny silnik — ENGINE = 'nazwa' w CREATE TABLE / ALTER TABLE</text><rect x="30" y="85" width="220" height="230" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/><text x="140" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e6e3a">InnoDB</text><line x1="45" y1="122" x2="235" y2="122" stroke="#1e8449"/><text x="45" y="144" font-size="11" fill="#333">✔ transakcje (COMMIT/ROLLBACK)</text><text x="45" y="162" font-size="11" fill="#333">✔ klucze obce (FOREIGN KEY)</text><text x="45" y="180" font-size="11" fill="#333">✔ blokowanie na poziomie wiersza</text><text x="45" y="198" font-size="11" fill="#333">✔ indeks klastrowy (dane = B-tree PK)</text><text x="45" y="216" font-size="11" fill="#333">✔ odporność na awarie (crash recovery)</text><text x="45" y="240" font-size="10.5" fill="#1e6e3a">Domyślny silnik od MySQL 5.5.</text><text x="45" y="258" font-size="10.5" fill="#1e6e3a">Zastosowanie: systemy transakcyjne,</text><text x="45" y="274" font-size="10.5" fill="#1e6e3a">sklepy, bankowość, ERP, CRM.</text><text x="45" y="298" font-size="10" fill="#555">Koszt: nieco wolniejsze proste</text><text x="45" y="312" font-size="10" fill="#555">odczyty niż w silnikach bez transakcji.</text><rect x="270" y="85" width="220" height="230" rx="8" fill="#fdf6e3" stroke="#b7950b" stroke-width="2"/><text x="380" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d1f">MyISAM</text><line x1="285" y1="122" x2="475" y2="122" stroke="#b7950b"/><text x="285" y="144" font-size="11" fill="#333">✘ brak transakcji</text><text x="285" y="162" font-size="11" fill="#333">✘ brak kluczy obcych</text><text x="285" y="180" font-size="11" fill="#333">blokowanie na poziomie tabeli</text><text x="285" y="198" font-size="11" fill="#333">✔ przeszukiwanie pełnotekstowe</text><text x="285" y="216" font-size="11" fill="#333">✔ spakowane indeksy (packed indexes)</text><text x="285" y="240" font-size="10.5" fill="#8a6d1f">Domyślny do MySQL 5.1.</text><text x="285" y="258" font-size="10.5" fill="#8a6d1f">Zastosowanie: dane głównie</text><text x="285" y="274" font-size="10.5" fill="#8a6d1f">do odczytu, wyszukiwarki tekstowe.</text><text x="285" y="298" font-size="10" fill="#555">Ryzyko: brak spójności przy</text><text x="285" y="312" font-size="10" fill="#555">równoczesnym zapisie wielu procesów.</text><rect x="510" y="85" width="220" height="230" rx="8" fill="#eef4fb" stroke="#2e6da4" stroke-width="2"/><text x="620" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8a">MEMORY</text><line x1="525" y1="122" x2="715" y2="122" stroke="#2e6da4"/><text x="525" y="144" font-size="11" fill="#333">dane trzymane w pamięci RAM</text><text x="525" y="162" font-size="11" fill="#333">✘ nietrwałe — znikają po restarcie</text><text x="525" y="180" font-size="11" fill="#333">✔ bardzo szybki odczyt/zapis</text><text x="525" y="198" font-size="11" fill="#333">indeksy haszujące (HASH) domyślnie</text><text x="525" y="216" font-size="11" fill="#333">brak wsparcia dla BLOB/TEXT</text><text x="525" y="240" font-size="10.5" fill="#1f4e8a">Dawniej znany jako HEAP.</text><text x="525" y="258" font-size="10.5" fill="#1f4e8a">Zastosowanie: tabele tymczasowe,</text><text x="525" y="274" font-size="10.5" fill="#1f4e8a">cache sesji, dane pomocnicze.</text><text x="525" y="298" font-size="10" fill="#555">Ryzyko: utrata danych przy</text><text x="525" y="312" font-size="10" fill="#555">restarcie serwera lub awarii zasilania.</text><rect x="750" y="85" width="220" height="230" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="2"/><text x="860" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a1f1f">ARCHIVE</text><line x1="765" y1="122" x2="955" y2="122" stroke="#c0392b"/><text x="765" y="144" font-size="11" fill="#333">tylko INSERT i SELECT</text><text x="765" y="162" font-size="11" fill="#333">✘ brak UPDATE i DELETE wierszy</text><text x="765" y="180" font-size="11" fill="#333">✔ silna kompresja danych (zlib)</text><text x="765" y="198" font-size="11" fill="#333">✘ brak indeksów (poza PK)</text><text x="765" y="216" font-size="11" fill="#333">minimalny narzut na przestrzeń dysku</text><text x="765" y="240" font-size="10.5" fill="#8a1f1f">Zastosowanie: archiwa, logi,</text><text x="765" y="258" font-size="10.5" fill="#8a1f1f">dane audytowe, historia zdarzeń,</text><text x="765" y="274" font-size="10.5" fill="#8a1f1f">z bardzo rzadkimi modyfikacjami.</text><text x="765" y="298" font-size="10" fill="#555">Koszt: wolniejszy odczyt losowy</text><text x="765" y="312" font-size="10" fill="#555">niż w silnikach z pełnym indeksowaniem.</text><rect x="30" y="350" width="940" height="70" rx="6" fill="#f8f8f8" stroke="#888" stroke-width="1"/><text x="50" y="374" font-size="12" font-weight="bold" fill="#333">Jak wybrać?</text><text x="50" y="394" font-size="11" fill="#333">Transakcje i integralność danych → InnoDB. Szybkie wyszukiwanie tekstu bez transakcji → MyISAM.</text><text x="50" y="410" font-size="11" fill="#333">Dane tymczasowe / cache → MEMORY. Archiwizacja, logi bez edycji → ARCHIVE.</text><rect x="30" y="440" width="940" height="150" rx="6" fill="#0f172a"/><text x="50" y="466" font-size="12" fill="#93c5fd" font-family="Consolas, monospace">-- ustawienie silnika przy tworzeniu tabeli</text><text x="50" y="488" font-size="12" fill="#e2e8f0" font-family="Consolas, monospace">CREATE TABLE zamowienia_log (id INT, tresc TEXT) ENGINE = ARCHIVE;</text><text x="50" y="516" font-size="12" fill="#93c5fd" font-family="Consolas, monospace">-- zmiana silnika istniejącej tabeli</text><text x="50" y="538" font-size="12" fill="#e2e8f0" font-family="Consolas, monospace">ALTER TABLE klienci ENGINE = InnoDB;</text><text x="50" y="566" font-size="12" fill="#93c5fd" font-family="Consolas, monospace">-- sprawdzenie silnika użytego przez tabelę</text><text x="50" y="588" font-size="11.5" fill="#e2e8f0" font-family="Consolas, monospace">SHOW TABLE STATUS LIKE 'klienci';</text></svg>