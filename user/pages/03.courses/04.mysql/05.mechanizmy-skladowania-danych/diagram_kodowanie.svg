<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif"><metadata/><rect width="1000" height="640" fill="#ffffff"/><text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Hierarchia kodowania znaków i reguł porównywania</text><text x="500" y="56" text-anchor="middle" font-size="12" fill="#555">każdy niższy poziom dziedziczy ustawienia z wyższego, chyba że jawnie je nadpisze</text><rect x="330" y="75" width="340" height="80" rx="8" fill="#eef4fb" stroke="#2e6da4" stroke-width="2"/><text x="500" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e8a">1. SERWER</text><text x="500" y="118" text-anchor="middle" font-size="11" fill="#333" font-family="Consolas, monospace">character-set-server = utf8</text><text x="500" y="136" text-anchor="middle" font-size="11" fill="#333" font-family="Consolas, monospace">collation-server = utf8_general_ci</text><path d="M500 155 L500 190" stroke="#555" stroke-width="2" marker-end="url(#arrowc)"/><text x="520" y="178" font-size="10" fill="#777">dziedziczenie</text><rect x="330" y="195" width="340" height="90" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/><text x="500" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e6e3a">2. BAZA DANYCH</text><text x="500" y="238" text-anchor="middle" font-size="10.5" fill="#333" font-family="Consolas, monospace">CREATE DATABASE sklep</text><text x="500" y="254" text-anchor="middle" font-size="10.5" fill="#333" font-family="Consolas, monospace">CHARACTER SET latin2 COLLATE latin2_general_ci;</text><text x="500" y="274" text-anchor="middle" font-size="10" fill="#1e6e3a">(nadpisuje ustawienie serwera dla tej bazy)</text><path d="M500 285 L500 320" stroke="#555" stroke-width="2" marker-end="url(#arrowc)"/><rect x="330" y="325" width="340" height="90" rx="8" fill="#fdf6e3" stroke="#b7950b" stroke-width="2"/><text x="500" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f">3. TABELA</text><text x="500" y="368" text-anchor="middle" font-size="10.5" fill="#333" font-family="Consolas, monospace">CREATE TABLE klienci (...)</text><text x="500" y="384" text-anchor="middle" font-size="10.5" fill="#333" font-family="Consolas, monospace">CHARACTER SET utf8 COLLATE utf8_polish_ci;</text><text x="500" y="404" text-anchor="middle" font-size="10" fill="#8a6d1f">(nadpisuje ustawienie bazy dla tej tabeli)</text><path d="M500 415 L500 450" stroke="#555" stroke-width="2" marker-end="url(#arrowc)"/><rect x="330" y="455" width="340" height="100" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="2"/><text x="500" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a1f1f">4. KOLUMNA</text><text x="500" y="497" text-anchor="middle" font-size="10.3" fill="#333" font-family="Consolas, monospace">kod_pocztowy VARCHAR(10)</text><text x="500" y="513" text-anchor="middle" font-size="10.3" fill="#333" font-family="Consolas, monospace">CHARACTER SET cp1250 COLLATE cp1250_polish_ci</text><text x="500" y="533" text-anchor="middle" font-size="10" fill="#8a1f1f">(nadpisuje ustawienie tabeli tylko dla tej kolumny)</text><rect x="20" y="195" width="280" height="360" rx="6" fill="#f8f8f8" stroke="#888"/><text x="35" y="218" font-size="13" font-weight="bold" fill="#333">Zestaw znaków (character set)</text><text x="35" y="240" font-size="11" fill="#333">• utf8 — Unicode, wielobajtowy,</text><text x="45" y="256" font-size="11" fill="#333"> uniwersalny standard (RFC 3629)</text><text x="35" y="278" font-size="11" fill="#333">• latin2 — ISO-8859-2, jednobajtowy,</text><text x="45" y="294" font-size="11" fill="#333"> starszy standard środkowoeuropejski</text><text x="35" y="316" font-size="11" fill="#333">• cp1250 — Windows-1250, strona</text><text x="45" y="332" font-size="11" fill="#333"> kodowa systemów Windows (PL)</text><text x="35" y="360" font-size="12" font-weight="bold" fill="#333">Sprawdzanie dostępnych opcji</text><text x="35" y="380" font-size="10.5" fill="#333" font-family="Consolas, monospace">SHOW CHARACTER SET;</text><text x="35" y="398" font-size="10.5" fill="#333" font-family="Consolas, monospace">SHOW COLLATION LIKE 'latin2%';</text><text x="35" y="428" font-size="12" font-weight="bold" fill="#333">Kodowanie połączenia klienta</text><text x="35" y="448" font-size="10.5" fill="#333" font-family="Consolas, monospace">SET NAMES 'cp1250';</text><text x="35" y="468" font-size="10" fill="#555">ustawia jednocześnie kodowanie</text><text x="35" y="482" font-size="10" fill="#555">zapytań, wyników i połączenia</text><defs><marker id="arrowc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs></svg>