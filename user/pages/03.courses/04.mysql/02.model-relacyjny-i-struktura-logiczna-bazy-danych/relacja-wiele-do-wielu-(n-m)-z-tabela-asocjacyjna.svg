<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto" style="background-color: #0f172a; border-radius: 8px;"><style> .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 6; } .title { fill: #38bdf8; font-family: sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; } .line { stroke: #475569; stroke-width: 1.5; } .text-pk { fill: #fbbf24; font-family: sans-serif; font-weight: bold; font-size: 13px; } .text-fk { fill: #c084fc; font-family: sans-serif; font-weight: bold; font-size: 13px; } .text-col { fill: #e2e8f0; font-family: sans-serif; font-size: 13px; } .rel-text { fill: #c084fc; font-family: sans-serif; font-weight: bold; font-size: 14px; text-anchor: middle; } .rel-line { stroke: #c084fc; stroke-width: 2.5; marker-start: url(#arrow-purple); marker-end: url(#arrow-purple); } </style><defs><marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/></marker></defs><g transform="translate(40, 40)"><rect width="260" height="240" class="box"/><text x="130" y="32" class="title">Autorzy</text><line x1="0" y1="50" x2="260" y2="50" class="line"/><text x="20" y="80" class="text-pk">PK: AutorId</text><text x="20" y="115" class="text-col">• Imie</text><text x="20" y="150" class="text-col">• Nazwisko</text></g><g transform="translate(350, 40)"><rect width="260" height="240" class="box"/><text x="130" y="32" class="title">Ksiazki_Autorzy</text><line x1="0" y1="50" x2="260" y2="50" class="line"/><text x="20" y="80" class="text-pk">PK: (KsiazkaId, AutorId)</text><text x="20" y="115" class="text-fk">FK: KsiazkaId</text><text x="20" y="150" class="text-fk">FK: AutorId</text></g><g transform="translate(660, 40)"><rect width="260" height="240" class="box"/><text x="130" y="32" class="title">Ksiazki</text><line x1="0" y1="50" x2="260" y2="50" class="line"/><text x="20" y="80" class="text-pk">PK: KsiazkaId</text><te