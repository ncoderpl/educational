<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 1000 460" font-family="Segoe UI, Arial, sans-serif"><metadata/><rect width="1000" height="460" fill="#ffffff"/><text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Redundancja danych i jej konsekwencje</text><text x="240" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a1f1f">Tabela zdenormalizowana</text><rect x="40" y="85" width="400" height="160" rx="6" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="55" y="108" font-size="11" fill="#333" font-weight="bold">zamowienie_id | klient | email | produkt</text><line x1="40" y1="115" x2="440" y2="115" stroke="#c0392b"/><text x="55" y="134" font-size="11" fill="#333">101 | Anna Nowak | anna@x.pl | Mysz</text><text x="55" y="152" font-size="11" fill="#333">102 | Anna Nowak | anna@x.pl | Klawiatura</text><text x="55" y="170" font-size="11" fill="#333">103 | Anna Nowak | anna@x.pl | Monitor</text><text x="55" y="188" font-size="11" fill="#a02020">↑ dane klienta powtórzone 3×</text><text x="55" y="206" font-size="10.5" fill="#a02020">błąd literowy w wierszu 103 → niespójność!</text><text x="55" y="224" font-size="10.5" fill="#a02020">zmiana e-maila = trzeba poprawić N wierszy</text><rect x="40" y="260" width="400" height="150" rx="6" fill="#fff8e1" stroke="#b7950b" stroke-width="1.5"/><text x="55" y="282" font-size="13" font-weight="bold" fill="#7a5c00">Anomalie wynikające z redundancji</text><text x="55" y="304" font-size="11" fill="#333">• anomalia aktualizacji — trzeba zmienić</text><text x="65" y="320" font-size="11" fill="#333"> wiele wierszy naraz, łatwo o pominięcie</text><text x="55" y="340" font-size="11" fill="#333">• anomalia wstawiania — nie można dodać</text><text x="65" y="356" font-size="11" fill="#333"> klienta bez żadnego zamówienia</text><text x="55" y="376" font-size="11" fill="#333">• anomalia usuwania — usunięcie ostatniego</text><text x="65" y="392" font-size="11" fill="#333"> zamówienia kasuje dane klienta</text><path d="M450 225 L510 225" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/><text x="760" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">Struktura znormalizowana</text><rect x="530" y="85" width="200" height="110" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/><text x="540" y="105" font-size="12" font-weight="bold" fill="#333">klienci</text><line x1="530" y1="111" x2="730" y2="111" stroke="#1e8449"/><text x="540" y="128" font-size="10.5" fill="#333">klient_id (PK)</text><text x="540" y="144" font-size="10.5" fill="#333">imie_nazwisko</text><text x="540" y="160" font-size="10.5" fill="#333">email (UNIQUE)</text><text x="540" y="180" font-size="10.5" fill="#1e8449">dane klienta — 1 miejsce</text><rect x="770" y="85" width="200" height="110" rx="6" fill="#eef4fb" stroke="#2e6da4" stroke-width="1.5"/><text x="780" y="105" font-size="12" font-weight="bold" fill="#333">zamowienia</text><line x1="770" y1="111" x2="970" y2="111" stroke="#2e6da4"/><text x="780" y="128" font-size="10.5" fill="#333">zamowienie_id (PK)</text><text x="780" y="144" font-size="10.5" fill="#333">klient_id (FK)</text><text x="780" y="160" font-size="10.5" fill="#333">produkt</text><text x="780" y="180" font-size="10.5" fill="#2e6da4">tylko odwołanie, bez powtórzeń</text><path d="M730 140 L770 140" stroke="#333" stroke-width="1.5"/><text x="750" y="132" font-size="10" text-anchor="middle" fill="#333">1:N</text><rect x="530" y="260" width="440" height="150" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/><text x="545" y="282" font-size="13" font-weight="bold" fill="#1e6e3a">Efekt normalizacji</text><text x="545" y="304" font-size="11" fill="#333">• każda informacja przechowywana raz</text><text x="545" y="324" font-size="11" fill="#333">• zmiana e-maila = jedna aktualizacja</text><text x="545" y="344" font-size="11" fill="#333">• klient może istnieć bez zamówień</text><text x="545" y="364" font-size="11" fill="#333">• usunięcie zamówienia nie kasuje klienta</text><text x="545" y="388" font-size="11" fill="#1e6e3a">spójność wymuszona strukturą, nie dyscypliną</text><defs><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs></svg>