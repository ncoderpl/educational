<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif"><metadata/><rect width="1000" height="560" fill="#ffffff"/><text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Droga do 3NF — kolejne postacie normalne</text><text x="120" y="70" font-size="15" font-weight="bold" fill="#8a1f1f">Dane niesznormalizowane</text><rect x="20" y="80" width="260" height="130" rx="6" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/><text x="30" y="100" font-size="12" fill="#333">zamowienie</text><line x1="20" y1="106" x2="280" y2="106" stroke="#c0392b"/><text x="30" y="124" font-size="11" fill="#333">id_zam | klient | produkty</text><text x="30" y="142" font-size="11" fill="#333">1 | Jan Kowalski |</text><text x="38" y="158" font-size="11" fill="#333">"Mysz, Klawiatura, Monitor"</text><text x="30" y="176" font-size="11" fill="#333">— wiele wartości w 1 komórce</text><text x="30" y="196" font-size="11" fill="#a02020">brak atomowości ✗</text><path d="M290 145 L350 145" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="70" font-size="15" font-weight="bold" fill="#8a6d1f">1NF</text><rect x="360" y="80" width="260" height="130" rx="6" fill="#fdf6e3" stroke="#b7950b" stroke-width="1.5"/><text x="370" y="100" font-size="12" fill="#333">pozycje_zamowienia</text><line x1="360" y1="106" x2="620" y2="106" stroke="#b7950b"/><text x="370" y="124" font-size="11" fill="#333">id_zam | klient | produkt</text><text x="370" y="142" font-size="11" fill="#333">1 | Jan Kowalski | Mysz</text><text x="370" y="158" font-size="11" fill="#333">1 | Jan Kowalski | Klawiatura</text><text x="370" y="174" font-size="11" fill="#333">1 | Jan Kowalski | Monitor</text><text x="370" y="196" font-size="11" fill="#8a6d1f">atomowe wartości, ale redundancja "klient" ✗</text><path d="M630 145 L690 145" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="760" y="70" font-size="15" font-weight="bold" fill="#1f6d3a">2NF</text><rect x="700" y="80" width="270" height="130" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/><text x="710" y="100" font-size="12" fill="#333">zamowienia (id_zam, klient)</text><line x1="700" y1="106" x2="970" y2="106" stroke="#1e8449"/><text x="710" y="124" font-size="11" fill="#333">1 | Jan Kowalski</text><text x="710" y="146" font-size="12" fill="#333">pozycje (id_zam, produkt)</text><line x1="700" y1="152" x2="970" y2="152" stroke="#1e8449"/><text x="710" y="170" font-size="11" fill="#333">1 | Mysz</text><text x="710" y="186" font-size="11" fill="#333">1 | Klawiatura</text><text x="710" y="200" font-size="11" fill="#1e8449">atrybuty zależne od całego klucza ✓</text><path d="M835 210 L835 260" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="300" font-size="15" font-weight="bold" fill="#1f4e8a" text-anchor="middle">Kolejny krok: eliminacja zależności przechodnich → 3NF</text><rect x="60" y="320" width="280" height="120" rx="6" fill="#eef4fb" stroke="#2e6da4" stroke-width="1.5"/><text x="70" y="340" font-size="12" fill="#333">PRZED (narusza 3NF)</text><line x1="60" y1="346" x2="340" y2="346" stroke="#2e6da4"/><text x="70" y="364" font-size="11" fill="#333">pracownicy(id, dzial_id, dzial_nazwa)</text><text x="70" y="382" font-size="11" fill="#333">1 | D01 | "Sprzedaż"</text><text x="70" y="398" font-size="11" fill="#333">2 | D01 | "Sprzedaż"</text><text x="70" y="418" font-size="10.5" fill="#a02020">dzial_nazwa zależy od dzial_id, nie od id ✗</text><path d="M350 380 L410 380" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="320" width="260" height="120" rx="6" fill="#eaf6ea" stroke="#1e8449" stroke-width="1.5"/><text x="430" y="340" font-size="12" fill="#333">PO (3NF)</text><line x1="420" y1="346" x2="680" y2="346" stroke="#1e8449"/><text x="430" y="364" font-size="11" fill="#333">pracownicy(id, dzial_id)</text><text x="430" y="380" font-size="11" fill="#333">1 | D01</text><text x="430" y="398" font-size="11" fill="#333">dzialy(dzial_id, dzial_nazwa)</text><text x="430" y="414" font-size="11" fill="#333">D01 | "Sprzedaż"</text><rect x="700" y="320" width="270" height="120" rx="6" fill="#f8f8f8" stroke="#888" stroke-width="1.2"/><text x="710" y="342" font-size="12" font-weight="bold" fill="#333">Skrót zasad</text><text x="710" y="362" font-size="11" fill="#333">1NF — brak wielowartościowych pól</text><text x="710" y="380" font-size="11" fill="#333">2NF — pełna zależność od klucza</text><text x="710" y="398" font-size="11" fill="#333">3NF — brak zależności przechodnich</text><text x="710" y="418" font-size="11" fill="#555">każda kolejna postać zawiera się w poprzedniej</text><text x="500" y="480" text-anchor="middle" font-size="12" fill="#555">Zasada ogólna: każdy atrybut niekluczowy zależy "od klucza, całego klucza i tylko od klucza".</text><text x="500" y="500" text-anchor="middle" font-size="12" fill="#555">(parafraza reguły Kenta, 1983)</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs></svg>