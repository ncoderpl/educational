<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 940 400" aria-label="Proces uczenia się adresów MAC przez przełącznik i przekazywania ramek"><metadata/><style> .t{font-family:Arial,sans-serif;font-size:13px;fill:#0f172a;text-anchor:middle} .h{font-family:Arial,sans-serif;font-size:15px;font-weight:bold;fill:#0f172a} .f{font-family:Arial,sans-serif;font-size:11.5px;fill:#334155} .m{font-family:Consolas,monospace;font-size:12px;fill:#0f172a} .th{font-family:Arial,sans-serif;font-size:12px;font-weight:bold;fill:#0f172a;text-anchor:middle} .port{fill:#e2e8f0;stroke:#1e293b;stroke-width:1.3} </style><rect width="940" height="400" fill="#ffffff"/><text class="h" x="20" y="26">Krok 1: ramka od PC-A (MAC AA:AA) do PC-C (MAC CC:CC) dociera na port 1</text><rect x="330" y="60" width="140" height="70" rx="8" fill="#fde68a" stroke="#1e293b" stroke-width="1.8"/><text class="t" x="400" y="98">SWITCH</text><rect class="port" x="300" y="85" width="26" height="20"/><text class="t" x="313" y="100" style="font-size:10px">1</text><rect class="port" x="474" y="85" width="26" height="20"/><text class="t" x="487" y="100" style="font-size:10px">2</text><rect class="port" x="388" y="55" width="26" height="20"/><text class="t" x="401" y="70" style="font-size:10px">3</text><rect class="port" x="388" y="135" width="26" height="20"/><text class="t" x="401" y="150" style="font-size:10px">4</text><circle cx="150" cy="95" r="22" fill="#93c5fd" stroke="#1e293b" stroke-width="1.5"/><text class="t" x="150" y="100">PC-A</text><text class="f" x="150" y="128" text-anchor="middle">MAC AA:AA</text><line x1="172" y1="95" x2="300" y2="95" stroke="#1e293b" stroke-width="2"/><path d="M280 88 L300 95 L280 102" fill="none" stroke="#dc2626" stroke-width="2.5"/><text class="f" x="235" y="80" text-anchor="middle" fill="#dc2626">ramka: SRC=AA:AA DST=CC:CC</text><circle cx="650" cy="95" r="22" fill="#fca5a5" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3"/><text class="t" x="650" y="100">PC-C ?</text><text class="f" x="650" y="128" text-anchor="middle">nieznany — brak wpisu w tablicy</text><text class="f" x="400" y="180" text-anchor="middle">1) Switch zapisuje: (AA:AA → port 1) 2) Szuka CC:CC w tablicy — BRAK 3) Zalewa (flooding) wszystkie porty poza 1</text><rect x="30" y="210" width="330" height="110" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.3"/><text class="h" x="45" y="232" style="font-size:13px">Tablica adresów MAC (CAM)</text><text class="th" x="105" y="252">Adres MAC</text><text class="th" x="230" y="252">Port</text><text class="th" x="310" y="252">Wiek</text><line x1="40" y1="260" x2="350" y2="260" stroke="#94a3b8"/><text class="m" x="105" y="278" text-anchor="middle">AA:AA:AA:AA:AA:AA</text><text class="m" x="230" y="278" text-anchor="middle">1</text><text class="m" x="310" y="278" text-anchor="middle">0 s</text><text class="m" x="105" y="298" text-anchor="middle">DD:DD:DD:DD:DD:DD</text><text class="m" x="230" y="298" text-anchor="middle">4</text><text class="m" x="310" y="298" text-anchor="middle">12 s</text><text class="f" x="45" y="316">(wpis dla CC:CC pojawi się dopiero, gdy PC-C coś nadeśle)</text><text class="h" x="420" y="232" style="font-size:13px">Krok 2: PC-C odpowiada (SRC=CC:CC)</text><text class="f" x="420" y="254">Switch uczy się: (CC:CC → port 2).</text><text class="f" x="420" y="272">Teraz zna oba adresy — kolejne ramki</text><text class="f" x="420" y="288">między AA:AA a CC:CC są przesyłane</text><text class="f" x="420" y="304">WYŁĄCZNIE na właściwy port (unicast),</text><text class="f" x="420" y="320">bez zalewania pozostałych portów.</text><text class="f" x="470" y="370" text-anchor="middle">Wpisy w tablicy CAM wygasają po okresie bezczynności (typowo 300 s) i są usuwane (aging).</text></svg>