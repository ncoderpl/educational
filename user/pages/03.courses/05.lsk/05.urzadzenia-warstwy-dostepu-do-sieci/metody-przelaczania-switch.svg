<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 960 330" aria-label="Porównanie metod przełączania: store-and-forward, cut-through, fragment-free"><metadata/><style>.t{font-family:Arial,sans-serif;font-size:12px;fill:#0f172a}.h{font-family:Arial,sans-serif;font-size:14px;font-weight:bold;fill:#0f172a}.f{font-family:Arial,sans-serif;font-size:11px;fill:#334155}</style><rect width="960" height="330" fill="#ffffff"/><text class="h" x="20" y="26">Moment rozpoczęcia retransmisji ramki przez przełącznik</text><text class="t" x="10" y="92">Store-and-Forward</text><rect x="230" y="70" width="40" height="34" fill="#fca5a5" stroke="#1e293b"/><text x="250" y="92" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">nagł.</text><rect x="270" y="70" width="500" height="34" fill="#86efac" stroke="#1e293b"/><text x="520" y="92" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">dane (payload)</text><rect x="770" y="70" width="40" height="34" fill="#fdba74" stroke="#1e293b"/><text x="790" y="92" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">FCS</text><line x1="810" y1="62" x2="810" y2="112" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/><text class="f" x="20" y="125">odczekuje na CAŁĄ ramkę i weryfikuje FCS przed retransmisją — zero błędnych ramek dalej, ale najwyższe opóźnienie</text><text class="t" x="10" y="172">Cut-Through</text><rect x="230" y="150" width="40" height="34" fill="#fca5a5" stroke="#1e293b"/><text x="250" y="172" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">nagł.</text><rect x="270" y="150" width="500" height="34" fill="#86efac" stroke="#1e293b"/><text x="520" y="172" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">dane (payload)</text><rect x="770" y="150" width="40" height="34" fill="#fdba74" stroke="#1e293b"/><text x="790" y="172" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">FCS</text><line x1="284" y1="142" x2="284" y2="192" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/><text class="f" x="20" y="205">zaczyna retransmisję zaraz po odczytaniu adresu MAC docelowego (ok. 14 B) — minimalne opóźnienie, ale przepuszcza uszkodzone ramki</text><text class="t" x="10" y="252">Fragment-Free</text><rect x="230" y="230" width="40" height="34" fill="#fca5a5" stroke="#1e293b"/><text x="250" y="252" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">nagł.</text><rect x="270" y="230" width="500" height="34" fill="#86efac" stroke="#1e293b"/><text x="520" y="252" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">dane (payload)</text><rect x="770" y="230" width="40" height="34" fill="#fdba74" stroke="#1e293b"/><text x="790" y="252" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">FCS</text><line x1="358" y1="222" x2="358" y2="272" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/><text class="f" x="20" y="285">czeka na pierwsze 64 B (poza limitem typowych fragmentów kolizyjnych) — kompromis opóźnienia i bezpieczeństwa</text><line x1="230" y1="290" x2="910" y2="290" stroke="#0f172a" stroke-width="1.3"/><path d="M910 290 L900 285 L900 295 Z" fill="#0f172a"/><text class="f" x="870" y="308">odbiór ramki w czasie</text></svg>