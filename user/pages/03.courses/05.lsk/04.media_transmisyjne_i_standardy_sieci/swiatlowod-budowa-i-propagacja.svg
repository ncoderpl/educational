<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 575" aria-label="Budowa światłowodu i propagacja światła w włóknach wielomodowych i jednomodowych"><metadata/><style> .t{font-family:Arial,sans-serif;font-size:13px;fill:#0f172a} .h{font-family:Arial,sans-serif;font-size:14px;font-weight:bold;fill:#0f172a} .c{font-family:Arial,sans-serif;font-size:12px;fill:#334155} .ld{stroke:#0f172a;stroke-width:1;fill:none} </style><rect width="900" height="575" fill="#ffffff"/><text class="h" x="20" y="24">Przekrój włókna światłowodowego</text><circle cx="110" cy="130" r="95" fill="#fde68a" stroke="#1e293b" stroke-width="1.5"/><circle cx="110" cy="130" r="72" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.2"/><circle cx="110" cy="130" r="48" fill="#bfdbfe" stroke="#1e293b" stroke-width="1.2"/><circle cx="110" cy="130" r="16" fill="#fef08a" stroke="#1e293b" stroke-width="1.2"/><path class="ld" d="M169 71 L240 55"/><circle cx="169" cy="71" r="2.5" fill="#0f172a"/><text class="t" x="246" y="59">Osłona zewnętrzna (płaszcz ochronny, np. LSZH lub PVC)</text><path class="ld" d="M168 114 L240 105"/><circle cx="168" cy="114" r="2.5" fill="#0f172a"/><text class="t" x="246" y="109">Bufor / powłoka ochronna (coating), ok. 250 µm</text><path class="ld" d="M141 138 L240 155"/><circle cx="141" cy="138" r="2.5" fill="#0f172a"/><text class="t" x="246" y="159">Płaszcz (cladding), 125 µm – niższy współczynnik załamania n₂</text><path class="ld" d="M116 134 L240 205"/><circle cx="116" cy="134" r="2.5" fill="#0f172a"/><text class="t" x="246" y="209">Rdzeń (core): 9 µm (SM) lub 50 / 62,5 µm (MM) – wyższy współczynnik n₁</text><text class="h" x="20" y="272">Włókno wielomodowe skokowe (MMF step-index)</text><rect x="40" y="282" width="820" height="70" fill="#dbeafe" stroke="#1e293b"/><rect x="40" y="297" width="820" height="40" fill="#fef9c3" stroke="#1e293b"/><path d="M40 317 L860 317" stroke="#16a34a" stroke-width="2" fill="none"/><path d="M40 317 L150 300 L260 334 L370 300 L480 334 L590 300 L700 334 L810 300 L860 312" stroke="#dc2626" stroke-width="2" fill="none"/><text class="c" x="40" y="372">Promienie o różnych kątach pokonują różne drogi → różne czasy dotarcia → dyspersja modowa (rozmywanie impulsów).</text><text class="h" x="20" y="400">Włókno wielomodowe gradientowe (MMF graded-index)</text><rect x="40" y="410" width="820" height="70" fill="#dbeafe" stroke="#1e293b"/><rect x="40" y="425" width="820" height="40" fill="#fef9c3" stroke="#1e293b"/><path d="M40 445 Q100 427 160 445 T280 445 T400 445 T520 445 T640 445 T760 445 T880 445" stroke="#dc2626" stroke-width="2" fill="none"/><path d="M40 445 L860 445" stroke="#16a34a" stroke-width="2" fill="none"/><text class="c" x="40" y="500">Współczynnik załamania maleje od osi ku brzegowi rdzenia → promienie zakrzywiają się, a czasy przejścia się wyrównują.</text><text class="h" x="20" y="524">Włókno jednomodowe (SMF)</text><rect x="40" y="532" width="820" height="26" fill="#dbeafe" stroke="#1e293b"/><rect x="40" y="542" width="820" height="6" fill="#fef9c3" stroke="#1e293b"/><path d="M40 545 L860 545" stroke="#dc2626" stroke-width="2" fill="none"/><text class="c" x="40" y="571">Jeden tryb propagacji (rdzeń ok. 9 µm) → najmniejsza dyspersja i największe zasięgi. Schemat nie zachowuje skali.</text></svg>