<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 820 400" font-family="Verdana, Arial, sans-serif"><metadata/><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker></defs><rect x="0" y="0" width="820" height="400" fill="#fbfcfe"/><text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Potok: strumień tekstu kontra strumień obiektów</text><text x="40" y="76" font-size="15" font-weight="bold" fill="#3d8361">Bash — przez potok płynie tekst</text><rect x="40" y="92" width="190" height="60" rx="8" fill="#3d8361"/><text x="135" y="128" text-anchor="middle" font-size="14" fill="#fff">polecenie źródłowe</text><line x1="230" y1="122" x2="290" y2="122" stroke="#4a5568" stroke-width="2" marker-end="url(#a2)"/><text x="248" y="112" font-size="16" fill="#4a5568">|</text><rect x="295" y="92" width="190" height="60" rx="8" fill="#4c7a9c"/><text x="390" y="120" text-anchor="middle" font-size="14" fill="#fff">filtr tekstowy</text><text x="390" y="138" text-anchor="middle" font-size="12" fill="#dbeafe">(grep, cut, sort)</text><line x1="485" y1="122" x2="545" y2="122" stroke="#4a5568" stroke-width="2" marker-end="url(#a2)"/><rect x="550" y="92" width="230" height="60" rx="8" fill="#2d3748"/><text x="665" y="128" text-anchor="middle" font-size="14" fill="#fff">wynik na ekranie lub w pliku</text><text x="40" y="175" font-size="12" fill="#4a5568">Każdy element potoku otrzymuje zwykłe linie tekstu i musi je samodzielnie rozdzielić na pola.</text><line x1="40" y1="200" x2="780" y2="200" stroke="#cbd5e0" stroke-width="1"/><text x="40" y="240" font-size="15" font-weight="bold" fill="#3f5b8c">PowerShell — przez potok płyną obiekty</text><rect x="40" y="256" width="190" height="60" rx="8" fill="#3f5b8c"/><text x="135" y="292" text-anchor="middle" font-size="14" fill="#fff">cmdlet źródłowy</text><line x1="230" y1="286" x2="290" y2="286" stroke="#4a5568" stroke-width="2" marker-end="url(#a2)"/><text x="248" y="276" font-size="16" fill="#4a5568">|</text><rect x="295" y="256" width="190" height="60" rx="8" fill="#4c7a9c"/><text x="390" y="284" text-anchor="middle" font-size="14" fill="#fff">filtr po właściwościach</text><text x="390" y="302" text-anchor="middle" font-size="12" fill="#dbeafe">(Where-Object, Sort-Object)</text><line x1="485" y1="286" x2="545" y2="286" stroke="#4a5568" stroke-width="2" marker-end="url(#a2)"/><rect x="550" y="256" width="230" height="60" rx="8" fill="#012456"/><text x="665" y="285" text-anchor="middle" font-size="14" fill="#fff">tabela, plik CSV,</text><text x="665" y="303" text-anchor="middle" font-size="14" fill="#fff">dalsze przetwarzanie</text><text x="40" y="340" font-size="12" fill="#4a5568">Obiekt zachowuje nazwane właściwości, więc filtrowanie odbywa się po polach, a nie po pozycji znaku w wierszu.</text><text x="410" y="378" text-anchor="middle" font-size="12" fill="#4a5568">Ta różnica decyduje o tym, jak buduje się złożone polecenia w obu powłokach</text></svg>