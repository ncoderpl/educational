<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 480" font-family="Segoe UI, Arial, sans-serif"><metadata/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker></defs><rect x="0" y="0" width="900" height="480" fill="#f7fafc"/><text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">Konfiguracja logowania SSH za pomocą pary kluczy</text><rect x="30" y="70" width="190" height="100" rx="10" fill="#2b6cb0"/><text x="125" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1. Generowanie</text><text x="125" y="120" text-anchor="middle" font-size="13" fill="#e2e8f0">kluczy</text><text x="125" y="142" text-anchor="middle" font-size="11" fill="#cbd5e0">PuTTYgen lub</text><text x="125" y="158" text-anchor="middle" font-size="11" fill="#cbd5e0">ssh-keygen</text><rect x="260" y="70" width="190" height="100" rx="10" fill="#2c7a7b"/><text x="355" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2. Zapis kluczy</text><text x="355" y="125" text-anchor="middle" font-size="12" fill="#e6fffa">klucz publiczny: .pub</text><text x="355" y="145" text-anchor="middle" font-size="12" fill="#e6fffa">klucz prywatny: .ppk</text><text x="355" y="163" text-anchor="middle" font-size="11" fill="#b2f5ea">(opcjonalny passphrase)</text><rect x="490" y="70" width="200" height="100" rx="10" fill="#2f855a"/><text x="590" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3. Import klucza</text><text x="590" y="123" text-anchor="middle" font-size="12" fill="#e6ffed">publicznego do routera</text><text x="590" y="145" text-anchor="middle" font-size="11" fill="#c6f6d5">WinBox: Files / Upload</text><text x="590" y="161" text-anchor="middle" font-size="11" fill="#c6f6d5">System / Users / SSH Keys</text><rect x="730" y="70" width="150" height="100" rx="10" fill="#975a16"/><text x="805" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4. Połączenie</text><text x="805" y="123" text-anchor="middle" font-size="12" fill="#fefcbf">PuTTY + klucz</text><text x="805" y="141" text-anchor="middle" font-size="12" fill="#fefcbf">prywatny</text><text x="805" y="159" text-anchor="middle" font-size="11" fill="#fbd38d">Auth/Credentials</text><line x1="220" y1="120" x2="260" y2="120" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arr)"/><line x1="450" y1="120" x2="490" y2="120" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arr)"/><line x1="690" y1="120" x2="730" y2="120" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arr)"/><rect x="30" y="220" width="850" height="130" rx="10" fill="#1a202c"/><text x="50" y="248" font-size="13" font-weight="bold" fill="#68d391">Przydatne polecenia terminala RouterOS:</text><text x="50" y="275" font-size="12" fill="#e2e8f0" font-family="Consolas, monospace">user ssh-keys import public-key-file=id_rsa.pub</text><text x="50" y="298" font-size="12" fill="#e2e8f0" font-family="Consolas, monospace">ssh -i c:\Users\luk\.ssh\id_rsa admin@192.168.88.1</text><text x="50" y="321" font-size="12" fill="#e2e8f0" font-family="Consolas, monospace">ip ssh set always-allow-password-login=yes</text><text x="50" y="341" font-size="11" fill="#a0aec0">(przywraca możliwość logowania klasycznego loginem i hasłem)</text><rect x="30" y="375" width="850" height="80" rx="10" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/><text x="50" y="400" font-size="13" font-weight="bold" fill="#c53030">Uwaga bezpieczeństwa</text><text x="50" y="422" font-size="12" fill="#742a2a">Po zaimportowaniu klucza logowanie hasłem zostaje domyślnie wyłączone.</text><text x="50" y="440" font-size="12" fill="#742a2a">Prywatny klucz (.ppk / id_rsa) trzymaj wyłącznie na swoim urządzeniu i nigdy go nie udostępniaj.</text></svg>