<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker></defs><rect x="0" y="0" width="860" height="400" fill="#f7fafc"/><text x="430" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Dwa sposoby połączenia WinBoksem z routerem</text><rect x="40" y="60" width="370" height="210" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/><text x="225" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5282">Połączenie w warstwie 3 (IP)</text><rect x="70" y="110" width="110" height="60" rx="8" fill="#2b6cb0"/><text x="125" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Komputer</text><text x="125" y="153" text-anchor="middle" font-size="10.5" fill="#e2e8f0">WinBox</text><rect x="310" y="110" width="90" height="60" rx="8" fill="#2c5282"/><text x="355" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Router</text><text x="355" y="153" text-anchor="middle" font-size="10.5" fill="#bee3f8">MikroTik</text><line x1="180" y1="140" x2="310" y2="140" stroke="#2c5282" stroke-width="2.5" marker-end="url(#aw)" marker-start="url(#aw)"/><text x="245" y="128" text-anchor="middle" font-size="10.5" fill="#2c5282" font-weight="bold">adres IP</text><rect x="60" y="190" width="330" height="60" rx="6" fill="#ffffff" stroke="#90cdf4" stroke-width="1"/><text x="75" y="210" font-size="11" fill="#2d3748" font-weight="bold">Nagłówek okna / pole Session:</text><text x="75" y="228" font-size="11" fill="#2d3748" font-family="Consolas, monospace">admin@192.168.88.1</text><text x="75" y="244" font-size="10.3" fill="#718096">wymaga poprawnej adresacji IP (np. bez konfliktu, działający DHCP)</text><rect x="450" y="60" width="370" height="210" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/><text x="635" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c4221">Połączenie w warstwie 2 (MAC)</text><rect x="480" y="110" width="110" height="60" rx="8" fill="#dd6b20"/><text x="535" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Komputer</text><text x="535" y="153" text-anchor="middle" font-size="10.5" fill="#feebc8">WinBox</text><rect x="720" y="110" width="90" height="60" rx="8" fill="#9c4221"/><text x="765" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Router</text><text x="765" y="153" text-anchor="middle" font-size="10.5" fill="#fbd38d">MikroTik</text><line x1="590" y1="140" x2="720" y2="140" stroke="#9c4221" stroke-width="2.5" marker-end="url(#aw)" marker-start="url(#aw)"/><text x="655" y="128" text-anchor="middle" font-size="10.5" fill="#9c4221" font-weight="bold">adres MAC</text><rect x="470" y="190" width="330" height="60" rx="6" fill="#ffffff" stroke="#fbd38d" stroke-width="1"/><text x="485" y="210" font-size="11" fill="#2d3748" font-weight="bold">Nagłówek okna / pole Session:</text><text x="485" y="228" font-size="11" fill="#2d3748" font-family="Consolas, monospace">admin@4C:5E:0C:11:22:33</text><text x="485" y="244" font-size="10.3" fill="#718096">działa nawet bez adresu IP routera</text><rect x="40" y="300" width="780" height="70" rx="8" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5"/><text x="60" y="325" font-size="12.5" font-weight="bold" fill="#22543d">Warunek połączenia po MAC:</text><text x="60" y="345" font-size="12" fill="#2f855a">komputer i router muszą znajdować się w tym samym segmencie LAN</text><text x="60" y="361" font-size="11.3" fill="#4a5568">(wspólna domena rozgłoszeniowa, bez pośrednictwa urządzeń routujących)</text></svg>