<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 800 460" font-family="Verdana, Arial, sans-serif"><metadata/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker></defs><rect x="0" y="0" width="800" height="460" fill="#fbfcfe"/><text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Diagnostyka: maszyna wirtualna się nie uruchamia</text><rect x="290" y="55" width="220" height="55" rx="10" fill="#4c7a9c"/><text x="400" y="88" text-anchor="middle" font-size="14" fill="#fff">Błąd startu maszyny wirtualnej</text><line x1="400" y1="110" x2="400" y2="135" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/><rect x="250" y="140" width="300" height="55" rx="10" fill="#dbe9fb" stroke="#3f5b8c" stroke-width="2"/><text x="400" y="163" text-anchor="middle" font-size="13" fill="#1a202c">Czy wirtualizacja sprzętowa jest</text><text x="400" y="182" text-anchor="middle" font-size="13" fill="#1a202c">włączona w BIOS-ie/UEFI?</text><line x1="250" y1="167" x2="120" y2="230" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/><text x="165" y="205" font-size="12" fill="#c0392b">NIE</text><rect x="20" y="230" width="220" height="60" rx="10" fill="#fbe4e4" stroke="#c0392b" stroke-width="2"/><text x="130" y="253" text-anchor="middle" font-size="12" fill="#1a202c">Włącz opcję wirtualizacji</text><text x="130" y="271" text-anchor="middle" font-size="12" fill="#1a202c">(Intel VT-x / AMD-V) w BIOS/UEFI</text><line x1="550" y1="167" x2="650" y2="230" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/><text x="600" y="205" font-size="12" fill="#2f6b4d">TAK</text><rect x="540" y="230" width="240" height="55" rx="10" fill="#dbe9fb" stroke="#3f5b8c" stroke-width="2"/><text x="660" y="253" text-anchor="middle" font-size="13" fill="#1a202c">Czy równolegle działa inny</text><text x="660" y="271" text-anchor="middle" font-size="13" fill="#1a202c">hipernadzorca (np. Hyper-V)?</text><line x1="660" y1="285" x2="660" y2="310" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/><text x="690" y="302" font-size="12" fill="#c0392b">TAK</text><rect x="540" y="310" width="240" height="60" rx="10" fill="#fbe4e4" stroke="#c0392b" stroke-width="2"/><text x="660" y="333" text-anchor="middle" font-size="12" fill="#1a202c">Wyłącz konfliktowy komponent</text><text x="660" y="351" text-anchor="middle" font-size="12" fill="#1a202c">w oknie Funkcje systemu Windows</text><line x1="130" y1="290" x2="130" y2="330" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="330" width="220" height="60" rx="10" fill="#e6f6ea" stroke="#2f6b4d" stroke-width="2"/><text x="130" y="353" text-anchor="middle" font-size="12" fill="#1a202c">Uruchom maszynę ponownie</text><text x="130" y="371" text-anchor="middle" font-size="12" fill="#1a202c">i zweryfikuj efekt</text><text x="400" y="430" text-anchor="middle" font-size="12" fill="#4a5568">Schemat porządkuje najczęstsze przyczyny problemów opisane w tym materiale</text></svg>