<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 850 320" font-family="Segoe UI, Arial, sans-serif"><metadata/><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker></defs><rect x="0" y="0" width="850" height="320" fill="#f7fafc"/><text x="425" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Alternatywne połączenie świata wirtualnego z rzeczywistym</text><rect x="40" y="90" width="180" height="90" rx="10" fill="#2b6cb0"/><text x="130" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Projekt GNS3</text><text x="130" y="144" text-anchor="middle" font-size="12" fill="#e2e8f0">obiekt Cloud</text><text x="130" y="162" text-anchor="middle" font-size="11" fill="#cbd5e0">(wirtualny router)</text><rect x="335" y="90" width="200" height="90" rx="10" fill="#2c7a7b"/><text x="435" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Karta sieciowa</text><text x="435" y="138" text-anchor="middle" font-size="12" fill="#e6fffa">Microsoft KM-Test</text><text x="435" y="156" text-anchor="middle" font-size="12" fill="#e6fffa">Loopback Adapter</text><text x="435" y="174" text-anchor="middle" font-size="10.5" fill="#b2f5ea">zainstalowana przez hdwwiz</text><rect x="630" y="90" width="180" height="90" rx="10" fill="#2f855a"/><text x="720" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">System hosta</text><text x="720" y="144" text-anchor="middle" font-size="12" fill="#e6ffed">(np. przeglądarka,</text><text x="720" y="162" text-anchor="middle" font-size="12" fill="#e6ffed">WinBox, PuTTY)</text><line x1="220" y1="135" x2="335" y2="135" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a2)" marker-start="url(#a2)"/><line x1="535" y1="135" x2="630" y2="135" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a2)" marker-start="url(#a2)"/><rect x="40" y="220" width="770" height="80" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/><text x="60" y="245" font-size="12.5" font-weight="bold" fill="#2d3748">Instalacja: Uruchom (Win+R) → hdwwiz → Zainstaluj sprzęt wybrany z listy (zaawansowane)</text><text x="60" y="265" font-size="12" fill="#4a5568">→ Karty sieciowe → producent: Microsoft → model: Karta Microsoft KM-Test ze sprzężeniem zwrotnym</text><text x="60" y="285" font-size="11.5" fill="#718096">Ważne: adres IP karty musi być zgodny z adresacją przyjętą w projekcie GNS3.</text></svg>