<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 850 380" font-family="Segoe UI, Arial, sans-serif"><metadata/><rect x="0" y="0" width="850" height="380" fill="#f7fafc"/><text x="425" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Konflikt trybów wirtualizacji w systemie Windows</text><rect x="40" y="70" width="340" height="130" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2"/><text x="210" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#22543d">Mogą działać równolegle ✓</text><rect x="70" y="115" width="120" height="55" rx="8" fill="#38a169"/><text x="130" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">VirtualBox</text><rect x="210" y="115" width="120" height="55" rx="8" fill="#2f855a"/><text x="270" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">VMware</text><text x="210" y="188" text-anchor="middle" font-size="11" fill="#22543d">obydwa to hiperwizory typu 2</text><rect x="460" y="70" width="350" height="130" rx="10" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/><text x="635" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#742a2a">Powodują konflikt ✗</text><rect x="490" y="115" width="130" height="55" rx="8" fill="#c53030"/><text x="555" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">VirtualBox /</text><text x="555" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">HAXM</text><text x="650" y="147" text-anchor="middle" font-size="20" font-weight="bold" fill="#742a2a">⚡</text><rect x="680" y="115" width="120" height="55" rx="8" fill="#742a2a"/><text x="740" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Hyper-V</text><text x="635" y="188" text-anchor="middle" font-size="11" fill="#742a2a">Hyper-V to hiperwizor typu 1 (bare-metal)</text><rect x="40" y="240" width="770" height="110" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/><text x="60" y="265" font-size="13" font-weight="bold" fill="#2d3748">Rozwiązanie konfliktu:</text><text x="60" y="288" font-size="12.5" fill="#4a5568">1. Uruchom okno „Uruchom” (Win+R) i wpisz: optionalfeatures</text><text x="60" y="308" font-size="12.5" fill="#4a5568">2. Na liście funkcji systemu Windows odznacz pozycję „Hyper-V”</text><text x="60" y="328" font-size="12.5" fill="#4a5568">3. Uruchom ponownie komputer, aby zmiana została zastosowana</text></svg>