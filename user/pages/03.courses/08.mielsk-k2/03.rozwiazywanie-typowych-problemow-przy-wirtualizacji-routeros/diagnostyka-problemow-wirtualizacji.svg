<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif"><metadata/><defs><marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker></defs><rect x="0" y="0" width="900" height="520" fill="#f7fafc"/><text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a202c">Diagnostyka: wirtualny router MikroTik się nie uruchamia</text><rect x="350" y="55" width="200" height="55" rx="10" fill="#2b6cb0"/><text x="450" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Maszyna wirtualna nie startuje</text><line x1="450" y1="110" x2="450" y2="140" stroke="#4a5568" stroke-width="2" marker-end="url(#a1)"/><polygon points="450,140 570,190 450,240 330,190" fill="#ffffff" stroke="#2d3748" stroke-width="2"/><text x="450" y="185" text-anchor="middle" font-size="12" fill="#2d3748">Wirtualizacja</text><text x="450" y="200" text-anchor="middle" font-size="12" fill="#2d3748">włączona w BIOS/UEFI?</text><line x1="330" y1="190" x2="150" y2="190" stroke="#c53030" stroke-width="2" marker-end="url(#a1)"/><text x="240" y="180" text-anchor="middle" font-size="12" fill="#c53030" font-weight="bold">NIE</text><rect x="20" y="165" width="220" height="80" rx="10" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/><text x="130" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#742a2a">Wejdź do BIOS/UEFI</text><text x="130" y="205" text-anchor="middle" font-size="11" fill="#742a2a">AMD: SVM Mode / SVM Support</text><text x="130" y="220" text-anchor="middle" font-size="11" fill="#742a2a">Intel: VT-x / VT-d</text><text x="130" y="235" text-anchor="middle" font-size="10.5" fill="#9b2c2c">Sprawdź w Menedżerze zadań</text><line x1="450" y1="240" x2="450" y2="275" stroke="#2f855a" stroke-width="2" marker-end="url(#a1)"/><text x="470" y="262" font-size="12" fill="#2f855a" font-weight="bold">TAK</text><polygon points="450,275 600,330 450,385 300,330" fill="#ffffff" stroke="#2d3748" stroke-width="2"/><text x="450" y="320" text-anchor="middle" font-size="12" fill="#2d3748">Zainstalowany Hyper-V</text><text x="450" y="335" text-anchor="middle" font-size="12" fill="#2d3748">obok VirtualBox / HAXM?</text><line x1="600" y1="330" x2="780" y2="330" stroke="#c53030" stroke-width="2" marker-end="url(#a1)"/><text x="690" y="320" text-anchor="middle" font-size="12" fill="#c53030" font-weight="bold">TAK</text><rect x="660" y="290" width="220" height="80" rx="10" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/><text x="770" y="313" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#742a2a">Wyłącz Hyper-V</text><text x="770" y="330" text-anchor="middle" font-size="11" fill="#742a2a">Uruchom: optionalfeatures</text><text x="770" y="346" text-anchor="middle" font-size="11" fill="#742a2a">odznacz Hyper-V, restart</text><text x="770" y="361" text-anchor="middle" font-size="10.5" fill="#9b2c2c">konieczne przy akceleracji HAXM</text><line x1="450" y1="385" x2="450" y2="415" stroke="#2f855a" stroke-width="2" marker-end="url(#a1)"/><text x="470" y="402" font-size="12" fill="#2f855a" font-weight="bold">NIE</text><rect x="330" y="415" width="240" height="70" rx="10" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5"/><text x="450" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">Sprawdź ustawienia VM</text><text x="450" y="458" text-anchor="middle" font-size="11" fill="#22543d">VirtualBox → Ustawienia →</text><text x="450" y="473" text-anchor="middle" font-size="11" fill="#22543d">System → Akceleracja</text><text x="450" y="510" text-anchor="middle" font-size="11" fill="#718096">Jeśli problem nadal występuje — rozważ zmianę systemu hosta (np. na Linux)</text></svg>