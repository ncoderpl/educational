<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 480" font-family="Consolas, 'Courier New', monospace"><metadata/><rect x="0" y="0" width="900" height="480" fill="#0f172a" rx="12"/><text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Architektura NFS — klient i serwer</text><g transform="translate(50,70)"><rect x="0" y="0" width="330" height="330" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="10"/><text x="165" y="30" text-anchor="middle" fill="#93c5fd" font-size="17" font-weight="bold">SERWER NFS</text><rect x="20" y="50" width="290" height="40" fill="#0f172a" stroke="#334155" rx="6"/><text x="30" y="75" fill="#e2e8f0" font-size="13">/etc/exports</text><text x="180" y="75" fill="#64748b" font-size="11">definicje eksportów</text><rect x="20" y="100" width="290" height="40" fill="#0f172a" stroke="#334155" rx="6"/><text x="30" y="125" fill="#e2e8f0" font-size="13">exportfs -ra</text><text x="200" y="125" fill="#64748b" font-size="11">aktywacja</text><rect x="20" y="150" width="290" height="40" fill="#0f172a" stroke="#334155" rx="6"/><text x="30" y="175" fill="#e2e8f0" font-size="13">rpcbind</text><text x="180" y="175" fill="#64748b" font-size="11">mapowanie portów RPC</text><rect x="20" y="200" width="290" height="40" fill="#0f172a" stroke="#334155" rx="6"/><text x="30" y="225" fill="#e2e8f0" font-size="13">rpc.mountd</text><text x="180" y="225" fill="#64748b" font-size="11">obsługa MOUNT</text><rect x="20" y="250" width="290" height="40" fill="#0f172a" stroke="#334155" rx="6"/><text x="30" y="275" fill="#e2e8f0" font-size="13">nfsd (kernel)</text><text x="180" y="275" fill="#64748b" font-size="11">obsługa I/O plików</text></g><g transform="translate(400,180)"><ellipse cx="100" cy="60" rx="100" ry="55" fill="#0891b2" opacity="0.25" stroke="#22d3ee"/><text x="100" y="55" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="bold">SIEĆ / RPC</text><text x="100" y="75" text-anchor="middle" fill="#67e8f9" font-size="11">TCP 2049 (NFSv4)</text></g><line x1="380" y1="230" x2="405" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><line x1="595" y1="230" x2="620" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs><g transform="translate(620,70)"><rect x="0" y="0" width="230" height="330" fill="#1e293b" stroke="#22c55e" stroke-width="2" rx="10"/><text x="115" y="30" text-anchor="middle" fill="#86efac" font-size="17" font-weight="bold">KLIENT NFS</text><rect x="15" y="50" width="200" height="40" fill="#0f172a" stroke="#334155" rx="6"/><text x="25" y="75" fill="#e2e8f0" font-size="13">/etc/fstab</text><rect x="15" y="100" width="200" height="40" fill="#0f172a" stroke="#334155" rx="6"/><text x="25" y="125" fill="#e2e8f0" font-size="12">mount -t nfs4</text><rect x="15" y="150" width="200" height="40" fill="#0f172a" stroke="#334155" rx="6"/><text x="25" y="175" fill="#e2e8f0" font-size="12">rpc.idmapd</text><rect x="15" y="200" width="200" height="40" fill="#0f172a" stroke="#334155" rx="6"/><text x="25" y="225" fill="#e2e8f0" font-size="12">autofs (opcjonalnie)</text><rect x="15" y="250" width="200" height="40" fill="#0f172a" stroke="#334155" rx="6"/><text x="25" y="275" fill="#e2e8f0" font-size="12">punkt montowania</text></g><text x="450" y="450" text-anchor="middle" fill="#94a3b8" font-size="13">Klient wysyła żądania RPC do serwera; nfsd obsługuje operacje na systemie plików zgodnie z /etc/exports</text></svg>