<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 460" font-family="Consolas, 'Courier New', monospace"><metadata/><rect x="0" y="0" width="900" height="460" fill="#0f172a" rx="12"/><text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Rozszerzone ACL — anatomia wpisu</text><g transform="translate(70,60)"><rect x="0" y="0" width="760" height="230" fill="#020617" stroke="#334155" rx="8"/><rect x="0" y="0" width="760" height="26" fill="#1e293b" rx="8"/><circle cx="14" cy="13" r="5" fill="#ef4444"/><circle cx="32" cy="13" r="5" fill="#f59e0b"/><circle cx="50" cy="13" r="5" fill="#22c55e"/><text x="380" y="18" text-anchor="middle" fill="#94a3b8" font-size="12">$ getfacl raport.csv</text><text x="20" y="55" fill="#64748b" font-size="14"># file: raport.csv</text><text x="20" y="75" fill="#64748b" font-size="14"># owner: jnowak</text><text x="20" y="95" fill="#64748b" font-size="14"># group: dzial_ksiegowosci</text><text x="20" y="125" fill="#e2e8f0" font-size="15">user::rw-</text><text x="20" y="150" fill="#93c5fd" font-size="15">user:kkowalski:r--</text><text x="20" y="175" fill="#e2e8f0" font-size="15">group::r--</text><text x="20" y="200" fill="#86efac" font-size="15">group:audytorzy:rw-</text><text x="20" y="222" fill="#fcd34d" font-size="15">mask::rw-</text><text x="330" y="222" fill="#f87171" font-size="15">other::---</text></g><g transform="translate(70,320)"><rect x="0" y="0" width="230" height="90" fill="#1d4ed8" opacity="0.2" stroke="#3b82f6" rx="6"/><text x="12" y="24" fill="#93c5fd" font-size="14" font-weight="bold">Wpis użytkownika</text><text x="12" y="46" fill="#cbd5e1" font-size="12">user:kkowalski:r--</text><text x="12" y="66" fill="#94a3b8" font-size="11">nadaje prawa konkretnemu</text><text x="12" y="80" fill="#94a3b8" font-size="11">kontu, poza właścicielem</text><rect x="255" y="0" width="230" height="90" fill="#15803d" opacity="0.2" stroke="#22c55e" rx="6"/><text x="267" y="24" fill="#86efac" font-size="14" font-weight="bold">Wpis grupy</text><text x="267" y="46" fill="#cbd5e1" font-size="12">group:audytorzy:rw-</text><text x="267" y="66" fill="#94a3b8" font-size="11">nadaje prawa dodatkowej</text><text x="267" y="80" fill="#94a3b8" font-size="11">grupie systemowej</text><rect x="510" y="0" width="240" height="90" fill="#b45309" opacity="0.2" stroke="#f59e0b" rx="6"/><text x="522" y="24" fill="#fcd34d" font-size="14" font-weight="bold">Maska ACL (mask)</text><text x="522" y="46" fill="#cbd5e1" font-size="12">mask::rw-</text><text x="522" y="66" fill="#94a3b8" font-size="11">górny limit efektywnych</text><text x="522" y="80" fill="#94a3b8" font-size="11">praw dla wpisów named</text></g><g transform="translate(70,430)"><text x="0" y="0" fill="#94a3b8" font-size="13">setfacl -m u:kkowalski:r-- raport.csv | setfacl -x u:kkowalski raport.csv | setfacl -b raport.csv (usuń wszystkie)</text></g></svg>