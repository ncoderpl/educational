<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 380" font-family="Consolas, 'Courier New', monospace"><metadata/><rect x="0" y="0" width="900" height="380" fill="#0f172a" rx="12"/><text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Struktura uprawnień POSIX</text><g transform="translate(90,70)"><text x="0" y="0" fill="#94a3b8" font-size="14">Wynik polecenia: ls -l plik.txt</text><rect x="0" y="15" width="720" height="50" fill="#1e293b" stroke="#334155" rx="6"/><text x="20" y="47" fill="#e2e8f0" font-size="24" letter-spacing="4">-rwxr-xr--</text></g><g transform="translate(90,150)"><rect x="0" y="0" width="60" height="60" fill="#334155" stroke="#475569" rx="6"/><text x="30" y="35" text-anchor="middle" fill="#f1f5f9" font-size="20">-</text><text x="30" y="80" text-anchor="middle" fill="#94a3b8" font-size="12">typ pliku</text><rect x="80" y="0" width="180" height="60" fill="#1d4ed8" opacity="0.25" stroke="#3b82f6" rx="6"/><text x="170" y="35" text-anchor="middle" fill="#93c5fd" font-size="20">rwx</text><text x="170" y="80" text-anchor="middle" fill="#93c5fd" font-size="13">właściciel (u) = 7</text><rect x="280" y="0" width="180" height="60" fill="#15803d" opacity="0.25" stroke="#22c55e" rx="6"/><text x="370" y="35" text-anchor="middle" fill="#86efac" font-size="20">r-x</text><text x="370" y="80" text-anchor="middle" fill="#86efac" font-size="13">grupa (g) = 5</text><rect x="480" y="0" width="180" height="60" fill="#b45309" opacity="0.25" stroke="#f59e0b" rx="6"/><text x="570" y="35" text-anchor="middle" fill="#fcd34d" font-size="20">r--</text><text x="570" y="80" text-anchor="middle" fill="#fcd34d" font-size="13">inni (o) = 4</text></g><g transform="translate(90,270)"><rect x="0" y="0" width="660" height="50" fill="#020617" stroke="#334155" rx="6"/><text x="20" y="32" fill="#38bdf8" font-size="18">chmod 754 plik.txt → rwx(7) r-x(5) r--(4)</text></g><g transform="translate(90,335)"><text x="0" y="0" fill="#94a3b8" font-size="13">r = odczyt (4) w = zapis (2) x = wykonanie / wejście do katalogu (1)</text></g></svg>