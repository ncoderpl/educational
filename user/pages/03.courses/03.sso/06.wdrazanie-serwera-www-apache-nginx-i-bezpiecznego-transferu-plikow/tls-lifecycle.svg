<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 460" font-family="Consolas, 'Courier New', monospace"><metadata/><rect x="0" y="0" width="900" height="460" fill="#0f172a" rx="12"/><text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Cykl życia certyfikatu SSL/TLS (OpenSSL)</text><g transform="translate(40,70)"><rect x="0" y="0" width="180" height="70" fill="#1e293b" stroke="#3b82f6" rx="8"/><text x="90" y="28" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">1. Klucz prywatny</text><text x="90" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">openssl genrsa</text><text x="90" y="62" text-anchor="middle" fill="#94a3b8" font-size="11">domena.key</text></g><line x1="220" y1="105" x2="260" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr2)"/><g transform="translate(260,70)"><rect x="0" y="0" width="180" height="70" fill="#1e293b" stroke="#22c55e" rx="8"/><text x="90" y="28" text-anchor="middle" fill="#86efac" font-size="13" font-weight="bold">2. CSR</text><text x="90" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">openssl req -new</text><text x="90" y="62" text-anchor="middle" fill="#94a3b8" font-size="11">domena.csr</text></g><line x1="440" y1="105" x2="480" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr2)"/><g transform="translate(480,70)"><rect x="0" y="0" width="180" height="70" fill="#1e293b" stroke="#f59e0b" rx="8"/><text x="90" y="22" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">3. Urząd CA</text><text x="90" y="42" text-anchor="middle" fill="#94a3b8" font-size="11">Let's Encrypt / self-signed</text><text x="90" y="60" text-anchor="middle" fill="#94a3b8" font-size="11">weryfikacja domeny</text></g><line x1="660" y1="105" x2="700" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr2)"/><g transform="translate(700,70)"><rect x="0" y="0" width="160" height="70" fill="#1e293b" stroke="#ef4444" rx="8"/><text x="80" y="28" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="bold">4. Certyfikat</text><text x="80" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">domena.crt</text><text x="80" y="62" text-anchor="middle" fill="#94a3b8" font-size="11">+ chain.pem</text></g><defs><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs><g transform="translate(260,180)"><rect x="0" y="0" width="600" height="50" fill="#020617" stroke="#334155" rx="6"/><text x="20" y="32" fill="#38bdf8" font-size="13">openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes</text></g><text x="260" y="248" fill="#64748b" font-size="12">↑ Wariant self-signed: pomija CSR i CA — certyfikat wystawiony samodzielnie (do testów/wewnętrznie)</text><text x="450" y="300" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Uproszczony uścisk dłoni TLS 1.3</text><g transform="translate(90,320)"><rect x="0" y="0" width="140" height="40" fill="#1d4ed8" opacity="0.25" stroke="#3b82f6" rx="6"/><text x="70" y="25" text-anchor="middle" fill="#93c5fd" font-size="12">Klient</text></g><g transform="translate(650,320)"><rect x="0" y="0" width="140" height="40" fill="#b45309" opacity="0.25" stroke="#f59e0b" rx="6"/><text x="70" y="25" text-anchor="middle" fill="#fcd34d" font-size="12">Serwer</text></g><line x1="230" y1="332" x2="650" y2="332" stroke="#64748b" stroke-dasharray="4,3"/><text x="440" y="325" text-anchor="middle" fill="#94a3b8" font-size="11">ClientHello (obsługiwane szyfry, SNI)</text><line x1="650" y1="352" x2="230" y2="352" stroke="#64748b" stroke-dasharray="4,3"/><text x="440" y="368" text-anchor="middle" fill="#94a3b8" font-size="11">ServerHello + certyfikat + klucz sesyjny</text><line x1="230" y1="392" x2="650" y2="392" stroke="#22c55e"/><text x="440" y="410" text-anchor="middle" fill="#86efac" font-size="12">Zaszyfrowana komunikacja HTTPS (klucz symetryczny)</text></svg>