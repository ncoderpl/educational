<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 480" font-family="Consolas, 'Courier New', monospace"><metadata/><rect x="0" y="0" width="900" height="480" fill="#0f172a" rx="12"/><text x="450" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">FTP vs SFTP — architektura połączeń</text><text x="40" y="75" fill="#93c5fd" font-size="15" font-weight="bold">FTP pasywny (vsftpd, pasv_enable=YES)</text><g transform="translate(40,90)"><rect x="0" y="0" width="140" height="44" fill="#1e293b" stroke="#3b82f6" rx="6"/><text x="70" y="27" text-anchor="middle" fill="#93c5fd" font-size="12">Klient FTP</text></g><g transform="translate(600,90)"><rect x="0" y="0" width="140" height="44" fill="#1e293b" stroke="#3b82f6" rx="6"/><text x="70" y="27" text-anchor="middle" fill="#93c5fd" font-size="12">Serwer vsftpd</text></g><line x1="180" y1="102" x2="600" y2="102" stroke="#3b82f6" stroke-width="2"/><text x="390" y="97" text-anchor="middle" fill="#94a3b8" font-size="11">port 21 — kanał kontrolny (polecenia)</text><line x1="180" y1="122" x2="600" y2="122" stroke="#22c55e" stroke-width="2"/><text x="390" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">port z zakresu pasv_min_port–pasv_max_port — kanał danych (klient inicjuje)</text><g transform="translate(40,165)"><rect x="0" y="0" width="700" height="34" fill="#020617" stroke="#334155" rx="6"/><text x="16" y="22" fill="#fca5a5" font-size="12">Zwykły FTP: dane i hasła przesyłane jawnym tekstem → FTPS dodaje TLS (implicit: 990, explicit: AUTH TLS na 21)</text></g><line x1="40" y1="220" x2="860" y2="220" stroke="#334155"/><text x="40" y="255" fill="#86efac" font-size="15" font-weight="bold">SFTP (podsystem OpenSSH — jeden port, w pełni szyfrowany)</text><g transform="translate(40,270)"><rect x="0" y="0" width="140" height="44" fill="#1e293b" stroke="#22c55e" rx="6"/><text x="70" y="27" text-anchor="middle" fill="#86efac" font-size="12">Klient SFTP</text></g><g transform="translate(600,270)"><rect x="0" y="0" width="140" height="44" fill="#1e293b" stroke="#22c55e" rx="6"/><text x="70" y="27" text-anchor="middle" fill="#86efac" font-size="12">sshd</text></g><line x1="180" y1="292" x2="600" y2="292" stroke="#22c55e" stroke-width="3"/><text x="390" y="284" text-anchor="middle" fill="#94a3b8" font-size="11">port 22 — jeden szyfrowany tunel (polecenia + dane)</text><g transform="translate(280,330)"><rect x="0" y="0" width="340" height="40" fill="#15803d" opacity="0.2" stroke="#22c55e" rx="6"/><text x="170" y="25" text-anchor="middle" fill="#86efac" font-size="12">Subsystem sftp /usr/lib/openssh/sftp-server</text></g><g transform="translate(40,390)"><rect x="0" y="0" width="820" height="80" fill="#0f172a" stroke="#334155" rx="6"/><text x="20" y="24" fill="#e2e8f0" font-size="12" font-weight="bold">FTP: wiele portów, brak szyfrowania (chyba że FTPS), problematyczny za NAT/firewall bez ALG</text><text x="20" y="46" fill="#e2e8f0" font-size="12" font-weight="bold">SFTP: jeden port (22), szyfrowanie i uwierzytelnianie z SSH (klucze/hasła), łatwy chroot</text><text x="20" y="68" fill="#94a3b8" font-size="11">Wybór: SFTP domyślnie zalecany dla nowych wdrożeń; FTP/FTPS tylko przy wymogach kompatybilności ze starszymi systemami</text></g></svg>