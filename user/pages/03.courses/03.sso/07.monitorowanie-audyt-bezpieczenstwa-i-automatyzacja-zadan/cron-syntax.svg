<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 380" font-family="Consolas, 'Courier New', monospace"><metadata/><rect x="0" y="0" width="900" height="380" fill="#0f172a" rx="12"/><text x="450" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Składnia wpisu w crontab</text><g transform="translate(80,60)"><rect x="0" y="0" width="740" height="50" fill="#1e293b" stroke="#334155" rx="6"/><text x="20" y="32" fill="#e2e8f0" font-size="20" letter-spacing="2">30 2 * * 1-5 /usr/local/bin/backup.sh</text></g><g transform="translate(80,140)"><rect x="0" y="0" width="120" height="70" fill="#1d4ed8" opacity="0.25" stroke="#3b82f6" rx="6"/><text x="60" y="30" text-anchor="middle" fill="#93c5fd" font-size="18">30</text><text x="60" y="52" text-anchor="middle" fill="#93c5fd" font-size="11">minuta</text><text x="60" y="66" text-anchor="middle" fill="#64748b" font-size="10">0–59</text><rect x="135" y="0" width="120" height="70" fill="#15803d" opacity="0.25" stroke="#22c55e" rx="6"/><text x="195" y="30" text-anchor="middle" fill="#86efac" font-size="18">2</text><text x="195" y="52" text-anchor="middle" fill="#86efac" font-size="11">godzina</text><text x="195" y="66" text-anchor="middle" fill="#64748b" font-size="10">0–23</text><rect x="270" y="0" width="120" height="70" fill="#b45309" opacity="0.25" stroke="#f59e0b" rx="6"/><text x="330" y="30" text-anchor="middle" fill="#fcd34d" font-size="18">*</text><text x="330" y="52" text-anchor="middle" fill="#fcd34d" font-size="11">dzień miesiąca</text><text x="330" y="66" text-anchor="middle" fill="#64748b" font-size="10">1–31</text><rect x="405" y="0" width="120" height="70" fill="#7c3aed" opacity="0.25" stroke="#a78bfa" rx="6"/><text x="465" y="30" text-anchor="middle" fill="#c4b5fd" font-size="18">*</text><text x="465" y="52" text-anchor="middle" fill="#c4b5fd" font-size="11">miesiąc</text><text x="465" y="66" text-anchor="middle" fill="#64748b" font-size="10">1–12</text><rect x="540" y="0" width="140" height="70" fill="#be185d" opacity="0.25" stroke="#ec4899" rx="6"/><text x="610" y="30" text-anchor="middle" fill="#f9a8d4" font-size="18">1-5</text><text x="610" y="52" text-anchor="middle" fill="#f9a8d4" font-size="11">dzień tygodnia</text><text x="610" y="66" text-anchor="middle" fill="#64748b" font-size="10">0–6 (0=niedz.)</text></g><text x="450" y="250" text-anchor="middle" fill="#94a3b8" font-size="13">Przykład: uruchom backup.sh o 2:30 w nocy, od poniedziałku do piątku</text><g transform="translate(80,280)"><rect x="0" y="0" width="740" height="80" fill="#020617" stroke="#334155" rx="6"/><text x="20" y="24" fill="#38bdf8" font-size="12">*/15 * * * * → co 15 minut</text><text x="20" y="46" fill="#38bdf8" font-size="12">0 3 * * 0 → co niedzielę o 3:00</text><text x="20" y="68" fill="#38bdf8" font-size="12">0 0 1 * * → pierwszego dnia każdego miesiąca o północy</text></g></svg>