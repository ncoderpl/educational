<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 460" font-family="Consolas, 'Courier New', monospace"><metadata/><rect x="0" y="0" width="900" height="460" fill="#0f172a" rx="12"/><text x="450" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Przepływ automatycznej kopii zapasowej</text><g transform="translate(40,70)"><rect x="0" y="0" width="160" height="60" fill="#1e293b" stroke="#a78bfa" rx="8"/><text x="80" y="26" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="bold">cron</text><text x="80" y="46" text-anchor="middle" fill="#94a3b8" font-size="11">0 2 * * * ...</text></g><line x1="200" y1="100" x2="250" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#b1)"/><g transform="translate(250,60)"><rect x="0" y="0" width="220" height="80" fill="#1d4ed8" opacity="0.2" stroke="#3b82f6" rx="8"/><text x="110" y="26" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">backup.sh</text><text x="110" y="46" fill="#94a3b8" font-size="11" text-anchor="middle">set -euo pipefail</text><text x="110" y="64" fill="#94a3b8" font-size="11" text-anchor="middle">logowanie + obsługa błędów</text></g><line x1="470" y1="100" x2="520" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#b1)"/><g transform="translate(520,60)"><rect x="0" y="0" width="180" height="80" fill="#15803d" opacity="0.2" stroke="#22c55e" rx="8"/><text x="90" y="26" text-anchor="middle" fill="#86efac" font-size="13" font-weight="bold">tar czf</text><text x="90" y="46" text-anchor="middle" fill="#94a3b8" font-size="11">kompresja gzip/zstd</text><text x="90" y="64" text-anchor="middle" fill="#94a3b8" font-size="11">*.tar.gz</text></g><line x1="610" y1="140" x2="610" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#b1)"/><g transform="translate(490,190)"><rect x="0" y="0" width="240" height="50" fill="#020617" stroke="#334155" rx="6"/><text x="120" y="32" text-anchor="middle" fill="#fcd34d" font-size="13">backup_2026-09-18.tar.gz</text></g><defs><marker id="b1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs><line x1="610" y1="240" x2="610" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#b1)"/><g transform="translate(340,290)"><rect x="0" y="0" width="240" height="70" fill="#b45309" opacity="0.2" stroke="#f59e0b" rx="8"/><text x="120" y="26" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">Rotacja lokalna</text><text x="120" y="46" text-anchor="middle" fill="#94a3b8" font-size="11">find ... -mtime +N -delete</text><text x="120" y="62" text-anchor="middle" fill="#94a3b8" font-size="11">zachowaj ostatnie N kopii</text></g><g transform="translate(610,290)"><rect x="0" y="0" width="230" height="70" fill="#be185d" opacity="0.2" stroke="#ec4899" rx="8"/><text x="115" y="26" text-anchor="middle" fill="#f9a8d4" font-size="13" font-weight="bold">Kopia zdalna</text><text x="115" y="46" text-anchor="middle" fill="#94a3b8" font-size="11">rsync / scp na inny host</text><text x="115" y="62" text-anchor="middle" fill="#94a3b8" font-size="11">zasada 3-2-1</text></g><line x1="490" y1="240" x2="460" y2="290" stroke="#94a3b8" stroke-width="2"/><line x1="620" y1="240" x2="700" y2="290" stroke="#94a3b8" stroke-width="2"/><g transform="translate(40,390)"><rect x="0" y="0" width="800" height="50" fill="#020617" stroke="#334155" rx="6"/><text x="20" y="32" fill="#94a3b8" font-size="12">logger "Backup zakończony: $STATUS" → journalctl / /var/log/backup.log; opcjonalne powiadomienie e-mail przy błędzie</text></g></svg>