<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 480" font-family="Segoe UI, Consolas, sans-serif"><metadata/><rect x="0" y="0" width="900" height="480" fill="#0f172a" rx="12"/><text x="450" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Edycje Windows Server i model licencjonowania</text><g transform="translate(60,60)"><rect x="0" y="0" width="360" height="160" fill="#1d4ed8" opacity="0.2" stroke="#3b82f6" stroke-width="2" rx="10"/><text x="180" y="28" text-anchor="middle" fill="#93c5fd" font-size="16" font-weight="bold">Windows Server Standard</text><text x="20" y="55" fill="#cbd5e1" font-size="12">• 2 wirtualne maszyny (lub 2 instancje Hyper-V)</text><text x="20" y="78" fill="#cbd5e1" font-size="12">• Wszystkie role serwerowe dostępne</text><text x="20" y="101" fill="#cbd5e1" font-size="12">• Brak Storage Spaces Direct / Shielded VM</text><text x="20" y="124" fill="#cbd5e1" font-size="12">• Zastosowanie: pojedyncze/małe wdrożenia</text><text x="20" y="147" fill="#94a3b8" font-size="11">Licencja: pakiety po 2 rdzenie, min. 16 rdzeni/serwer</text></g><g transform="translate(480,60)"><rect x="0" y="0" width="360" height="160" fill="#15803d" opacity="0.2" stroke="#22c55e" stroke-width="2" rx="10"/><text x="180" y="28" text-anchor="middle" fill="#86efac" font-size="16" font-weight="bold">Windows Server Datacenter</text><text x="20" y="55" fill="#cbd5e1" font-size="12">• Nieograniczona liczba maszyn wirtualnych</text><text x="20" y="78" fill="#cbd5e1" font-size="12">• Storage Spaces Direct, Shielded VMs</text><text x="20" y="101" fill="#cbd5e1" font-size="12">• Sieci definiowane programowo (SDN)</text><text x="20" y="124" fill="#cbd5e1" font-size="12">• Zastosowanie: klastry, high-density hosting</text><text x="20" y="147" fill="#94a3b8" font-size="11">Licencja: droższa, ten sam model per-core</text></g><text x="450" y="255" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Licencje dostępowe (CAL) — niezależne od licencji serwera</text><g transform="translate(60,275)"><rect x="0" y="0" width="250" height="100" fill="#b45309" opacity="0.2" stroke="#f59e0b" rx="8"/><text x="125" y="26" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="bold">User CAL</text><text x="15" y="50" fill="#cbd5e1" font-size="11">Przypisana do osoby —</text><text x="15" y="68" fill="#cbd5e1" font-size="11">korzysta z wielu urządzeń</text><text x="15" y="86" fill="#cbd5e1" font-size="11">(laptop, telefon, stacja)</text></g><g transform="translate(330,275)"><rect x="0" y="0" width="250" height="100" fill="#7c3aed" opacity="0.2" stroke="#a78bfa" rx="8"/><text x="125" y="26" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="bold">Device CAL</text><text x="15" y="50" fill="#cbd5e1" font-size="11">Przypisana do urządzenia —</text><text x="15" y="68" fill="#cbd5e1" font-size="11">optymalna przy pracy zmianowej</text><text x="15" y="86" fill="#cbd5e1" font-size="11">(wielu userów, 1 stacja)</text></g><g transform="translate(600,275)"><rect x="0" y="0" width="250" height="100" fill="#be185d" opacity="0.2" stroke="#ec4899" rx="8"/><text x="125" y="26" text-anchor="middle" fill="#f9a8d4" font-size="14" font-weight="bold">RDS CAL</text><text x="15" y="50" fill="#cbd5e1" font-size="11">Dodatkowa, niezależna —</text><text x="15" y="68" fill="#cbd5e1" font-size="11">wymagana przy dostępie do</text><text x="15" y="86" fill="#cbd5e1" font-size="11">pulpitów/aplikacji zdalnych</text></g><g transform="translate(60,400)"><rect x="0" y="0" width="790" height="60" fill="#020617" stroke="#334155" rx="6"/><text x="20" y="26" fill="#38bdf8" font-size="12">Przykład: serwer plików (1× fizyczny CPU, 8 rdzeni) dla 50 pracowników</text><text x="20" y="46" fill="#94a3b8" font-size="11">→ licencja Standard na min. 16 rdzeni + 50× User CAL (lub Device CAL, jeśli mniej stacji niż userów)</text></g></svg>