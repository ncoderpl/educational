th="2"/><line x1="650" y1="305" x2="450" y2="345" stroke="#94a3b8" stroke-width="2"/><g transform="translate(300,345)"><rect x="0" y="0" width="300" height="70" fill="#b45309" opacity="0.2" stroke="#f59e0b" rx="8"/><text x="150" y="28" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">5. Konfiguracja poinstalacyjna</text><text x="150" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Server Manager / sconfig: nazwa, IP, aktualizacje</text></g></svg>