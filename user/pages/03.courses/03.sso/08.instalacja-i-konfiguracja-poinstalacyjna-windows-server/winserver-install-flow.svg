<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 460" font-family="Segoe UI, Consolas, sans-serif"><metadata/><rect x="0" y="0" width="900" height="460" fill="#0f172a" rx="12"/><text x="450" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Instalacja Windows Server w środowisku wirtualnym</text><g transform="translate(40,70)"><rect x="0" y="0" width="150" height="70" fill="#1e293b" stroke="#3b82f6" rx="8"/><text x="75" y="26" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">1. Hiperwizor</text><text x="75" y="46" text-anchor="middle" fill="#94a3b8" font-size="10">Hyper-V / VMware</text><text x="75" y="60" text-anchor="middle" fill="#94a3b8" font-size="10">/ VirtualBox / Proxmox</text></g><line x1="190" y1="105" x2="230" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/><g transform="translate(230,70)"><rect x="0" y="0" width="150" height="70" fill="#1e293b" stroke="#22c55e" rx="8"/><text x="75" y="26" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">2. Utworzenie VM</text><text x="75" y="46" text-anchor="middle" fill="#94a3b8" font-size="10">min. 2 vCPU, 4 GB RAM</text><text x="75" y="60" text-anchor="middle" fill="#94a3b8" font-size="10">dysk 60+ GB (VHDX)</text></g><line x1="380" y1="105" x2="420" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/><g transform="translate(420,70)"><rect x="0" y="0" width="150" height="70" fill="#1e293b" stroke="#f59e0b" rx="8"/><text x="75" y="26" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">3. Podpięcie ISO</text><text x="75" y="46" text-anchor="middle" fill="#94a3b8" font-size="10">obraz instalacyjny</text><text x="75" y="60" text-anchor="middle" fill="#94a3b8" font-size="10">Windows Server</text></g><line x1="570" y1="105" x2="610" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#w1)"/><g transform="translate(610,70)"><rect x="0" y="0" width="230" h