<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 900 460" font-family="Segoe UI, Consolas, sans-serif"><metadata/><rect x="0" y="0" width="900" height="460" fill="#0f172a" rx="12"/><text x="450" y="36" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Profile Zapory Windows Defender Firewall</text><g transform="translate(50,70)"><rect x="0" y="0" width="250" height="140" fill="#1d4ed8" opacity="0.2" stroke="#3b82f6" stroke-width="2" rx="10"/><text x="125" y="28" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="bold">Domain</text><text x="15" y="55" fill="#cbd5e1" font-size="12">Sieć z kontrolerem domeny</text><text x="15" y="75" fill="#cbd5e1" font-size="12">Active Directory</text><text x="15" y="100" fill="#94a3b8" font-size="11">Wykrywany automatycznie po</text><text x="15" y="118" fill="#94a3b8" font-size="11">przyłączeniu do domeny</text></g><g transform="translate(325,70)"><rect x="0" y="0" width="250" height="140" fill="#15803d" opacity="0.2" stroke="#22c55e" stroke-width="2" rx="10"/><text x="125" y="28" text-anchor="middle" fill="#86efac" font-size="15" font-weight="bold">Private</text><text x="15" y="55" fill="#cbd5e1" font-size="12">Sieć zaufana (dom, biuro)</text><text x="15" y="75" fill="#cbd5e1" font-size="12">ręcznie oznaczona jako prywatna</text><text x="15" y="100" fill="#94a3b8" font-size="11">Umiarkowane ograniczenia,</text><text x="15" y="118" fill="#94a3b8" font-size="11">widoczność w sieci lokalnej</text></g><g transform="translate(600,70)"><rect x="0" y="0" width="250" height="140" fill="#b45309" opacity="0.2" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="125" y="28" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="bold">Public</text><text x="15" y="55" fill="#cbd5e1" font-size="12">Sieć niezaufana (hotel, kawiarnia)</text><text x="15" y="75" fill="#cbd5e1" font-size="12">domyślny profil dla nowej sieci</text><text x="15" y="100" fill="#94a3b8" font-size="11">Maksymalne restrykcje,</text><text x="15" y="118" fill="#94a3b8" font-size="11">brak widoczności w otoczeniu</text></g><text x="450" y="250" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Przepływ ewaluacji ruchu przychodzącego</text><g transform="translate(60,270)"><rect x="0" y="0" width="160" height="50" fill="#1e293b" stroke="#64748b" rx="6"/><text x="80" y="30" text-anchor="middle" fill="#e2e8f0" font-size="12">Pakiet przychodzący</text></g><line x1="220" y1="295" x2="270" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1)"/><defs><marker id="f1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs><g transform="translate(270,270)"><rect x="0" y="0" width="220" height="50" fill="#1e293b" stroke="#a78bfa" rx="6"/><text x="110" y="30" text-anchor="middle" fill="#c4b5fd" font-size="12">Dopasowanie profilu sieci</text></g><line x1="490" y1="295" x2="540" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1)"/><g transform="translate(540,270)"><rect x="0" y="0" width="220" height="50" fill="#1e293b" stroke="#ec4899" rx="6"/><text x="110" y="30" text-anchor="middle" fill="#f9a8d4" font-size="12">Reguły dla tego profilu</text></g><line x1="650" y1="320" x2="650" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#f1)"/><g transform="translate(430,370)"><rect x="0" y="0" width="220" height="50" fill="#15803d" opacity="0.3" stroke="#22c55e" rx="6"/><text x="110" y="30" text-anchor="middle" fill="#86efac" font-size="12">ALLOW → pakiet przepuszczony</text></g><g transform="translate(230,370)"><rect x="0" y="0" width="180" height="50" fill="#7f1d1d" opacity="0.4" stroke="#ef4444" rx="6"/><text x="90" y="30" text-anchor="middle" fill="#fca5a5" font-size="12">BLOCK (domyślnie)</text></g><text x="450" y="440" text-anchor="middle" fill="#94a3b8" font-size="11">Domyślna polityka: blokuj ruch przychodzący, zezwalaj na wychodzący — reguły dodaje się jawnie per profil (netsh advfirewall / New-NetFirewallRule)</text></svg>